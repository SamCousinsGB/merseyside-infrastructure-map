// ---- LOCAL-ONLY overlays (never published) -----------------------------------
// Optional private layers driven by local/manifest.json. The entire local/
// directory is git-ignored, so these exist only on a local checkout and NEVER on
// the public GitHub Pages deploy: on the deploy the manifest 404s and no local
// layer is added, so there is not even an empty toggle. This is the safe place
// to view data you are licensed to see but not to republish (e.g. HP asset data
// from the MAPS Viewer): it lives on your machine, drawn by the map, and cannot
// leak into git. Populating local/ is the user's responsibility; nothing about
// its contents is committed. See local/README.md for the manifest format.
const LOCAL_PRESS={HPN:'National high pressure (&gt;7 barg)',HPL:'Local high pressure (&gt;7 barg)',
                   HP:'High pressure (&gt;7 barg)',IP:'Intermediate (&gt;2, &le;7 barg)',
                   MP:'Medium (&gt;75 mbarg, &le;2 barg)',LP:'Low (&le;75 mbarg)',UN:'Unknown pressure'};
const LOCAL_KNOWN=['pressure','spec','diameter_mm','material','inserted_into','asset_id','surveyed','kind'];
// Popups lead with the fields a pressure-tier export actually carries, then fall
// back to listing whatever else the source put on the feature, so a manifest
// layer from some other export is still fully readable.
function localPopup(spec,f,ll,note){
  const p=f.properties||{}, rows=[];
  const add=(k,v)=>{ if(v!==undefined&&v!==null&&v!=='') rows.push(`<tr><td class="k">${k}</td><td>${v}</td></tr>`); };
  add('pressure',LOCAL_PRESS[p.pressure]||p.pressure);
  add('spec',p.spec);
  add('diameter',p.diameter_mm!=null?p.diameter_mm+'&nbsp;mm':null);
  add('material',GAS_MAT[p.material]||p.material);
  add('inserted into',p.inserted_into);
  add('asset id',p.asset_id);
  add('surveyed',p.surveyed?String(p.surveyed).replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3'):null);
  for(const [k,v] of Object.entries(p)) if(!LOCAL_KNOWN.includes(k)) add(k,String(v));
  L.popup({className:'tt'}).setLatLng(ll).setContent(card({
    color:GAS_COL[String(p.pressure||'').toUpperCase()]||spec.color||GAS_TRANS_COL,
    icon:p.kind==='plant'?ICON.station:ICON.pipe,
    kicker:p.kind==='plant'?'Gas plant':'Gas main',
    meta:(spec.label||'Gas layer')+(note?' &middot; '+note:''),
    rows:rows.join(''), lat:ll.lat, lon:ll.lng})).openOn(map);
}

// Tiled local layers. A whole-file fetch stops being viable long before half a
// million features, so build_gas_local.mjs writes any big layer as a sparse tile
// tree and says so in the manifest (tiles/grid/minzoom). This is the same
// viewport-windowed pattern as the gas and LV tile trees; the grid zoom is
// per-layer because a dense LP tier needs finer tiles than an HP one.
const localRenders=[];   // moveend hooks, one per tiled local layer
const localGated=[];     // {layer,minzoom,label} - feeds the zoom hint
const gasGated=[];       // {layer,label} for the pressure toggles - same hint
const localTiers=new Set();  // pressure tiers an overlay supplies; drives the legend
// `base` is the directory the manifest's paths are relative to, so the same
// renderer serves the committed MAPS tiers (tiles/mapsgeo/) and any private
// overlay (local/) without either knowing about the other.
// Keyed by URL and shared by every tiled layer, so the mains and plant views of
// the same tier cost one fetch between them rather than one each.
const tileCache=new Map(); const TILE_MAXCACHE=260;
async function fetchTileJSON(url){
  if(tileCache.has(url)){const v=tileCache.get(url);tileCache.delete(url);tileCache.set(url,v);return v;}
  let fc={features:[]};
  try{const r=await fetch(url);if(r.ok)fc=await r.json();}catch(e){}
  tileCache.set(url,fc);
  while(tileCache.size>TILE_MAXCACHE)tileCache.delete(tileCache.keys().next().value);
  return fc;
}
function localTileLayer(spec,style,base,o){
  const {note=null,filter=null,gated=true}=o||{};
  const group=L.layerGroup();
  const grid=spec.grid||14, minz=spec.minzoom||14;
  layerMinZoom.set(group,minz);
  let gj=null, sig=null, token=0;
  const tile=(x,y)=>fetchTileJSON(base+spec.tiles+'/'+x+'/'+y+'.json');
  async function render(){
    if(!map.hasLayer(group)||map.getZoom()<minz){ if(gj)gj.clearLayers(); sig=null; return; }
    const t=++token, b=map.getBounds().pad(0.2);
    const x0=lvLon2x(b.getWest(),grid),x1=lvLon2x(b.getEast(),grid),
          y0=lvLat2y(b.getNorth(),grid),y1=lvLat2y(b.getSouth(),grid);
    // as with the LV cables, the drawn set is fully determined by the tile
    // window: same window => nothing to redraw.
    const s=x0+':'+x1+':'+y0+':'+y1;
    if(s===sig&&gj&&gj.getLayers().length) return;
    sig=s;
    const reqs=[]; for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)reqs.push(tile(x,y));
    const fcs=await Promise.all(reqs);
    if(t!==token) return;                      // a newer render superseded this one
    const seen=new Set(), feats=[];
    for(const fc of fcs)for(const f of (fc.features||[])){ if(seen.has(f.id))continue; seen.add(f.id);
      if(filter&&!filter(f))continue; feats.push(f); }
    if(!gj){
      gj=L.geoJSON(null,{style,
        pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:3,color:'#fff',weight:1,fillColor:style(f).color,fillOpacity:.95}),
        onEachFeature:(f,l)=>l.on('click',e=>localPopup(spec,f,e.latlng||(l.getLatLng&&l.getLatLng())||map.getCenter(),note))});
      group.addLayer(gj);
    }
    gj.clearLayers();
    gj.addData({type:'FeatureCollection',features:feats});
  }
  localRenders.push(render);
  gradedHooks.push(()=>{ if(gj&&map.hasLayer(group)) try{ gj.setStyle(style); }catch(e){} });
  // MAPS tiers opt out of the hint: they sit inside one toggle at staggered
  // zooms on purpose (HP spine wide, LP only close in), so "zoom in to see the
  // LP" would be nagging about intended behaviour, not reporting a fault.
  if(gated) localGated.push({layer:group,minzoom:minz,label:spec.label||'gas layer'});
  group.on('add',()=>{render();updateLvHint();});
  group.on('remove',()=>{if(gj)gj.clearLayers();sig=null;updateLvHint();});
  return group;
}
function syncLocal(){ for(const r of localRenders) r(); }

// One builder for a manifest of pressure-tier layers, used twice:
//   tiles/mapsgeo/meta.json - the committed MAPS extract, always present, loads
//                             like every other layer with no setup step
//   local/manifest.json     - an optional private overlay, only ever on a local
//                             checkout (see the note above loadLocalLayers)
// Both describe a layer the same way, so a tier can move between them without a
// code change here.
async function fetchManifest(url){
  try{
    const r = await fetch(url, {cache:'no-store'});
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }                    // absent / malformed -> silently none
}
// Build one layer from a manifest entry. `o` may carry {note, filter, gated}.
function tierLayer(spec, base, o){
  const color  = spec.color || GAS_TRANS_COL;
  const weight = spec.weight || 3;
  // zoom-graded like every other line, and dashed where the source says buried
  const style  = f => { const w=W(weight);
    return {color, weight:w, opacity:.95, lineCap:'round', lineJoin:'round',
            dashArray: (spec.dash||(f.properties&&f.properties.ug)) ? DASH(w) : null}; };
  return spec.tiles
    ? localTileLayer(spec, style, base, o)   // registers its own grade hook
    : gradeGroup(lazyGeoJSON(base+spec.file, {
        style,
        filter: (o&&o.filter) || undefined,
        pointToLayer: (f,ll)=>L.circleMarker(ll,{radius:4,color:'#fff',weight:1.5,fillColor:color,fillOpacity:.95}),
        onEachFeature: (f,l)=>l.on('click',e=>
          localPopup(spec,f,e.latlng||(l.getLatLng&&l.getLatLng())||map.getCenter(),(o&&o.note)||null))
      }), style);
}
const isPlantFeature = f => ((f.properties||{}).kind === 'plant');

// The committed MAPS extract. Mains stay keyed by pressure so the four useful
// network toggles remain independent; plant is retained only where the build
// associated it with an above-ground installation.
async function buildMapsGas(){
  const man = await fetchManifest('tiles/mapsgeo/meta.json');
  const specs = (man&&man.layers||[]).filter(s => s && (s.file||s.tiles));
  if(!specs.length) return null;
  if(Array.isArray(man.bounds) && man.bounds.length===4) mapsBounds = man.bounds;
  // Keyed by tier, not merged: the drawer now offers one toggle per pressure,
  // so each tier has to be switchable on its own.
  const mainsByTier={};
  for(const spec of specs){
    const tier=String(spec.tier||'').toUpperCase();
    if(tier) localTiers.add(tier);
    mainsByTier[tier]=tierLayer(spec,'tiles/mapsgeo/',{filter:f=>!isPlantFeature(f), gated:false});
  }
  return { mainsByTier };
}

async function loadTierLayers(base, manifestUrl, opts){
  const {suffix='', note=null, keyPrefix=''} = opts||{};
  const man = await fetchManifest(manifestUrl);
  if(!man) return [];
  const out = [];
  for(const spec of (man.layers||[])){
    if(!spec || (!spec.file && !spec.tiles)) continue;
    const t = spec.tier || (/^(?:gas|maps)-([a-z]+)$/.exec(spec.id||'')||[])[1];
    if(t) localTiers.add(String(t).toUpperCase());
    const color = spec.color || GAS_TRANS_COL;
    const layer = tierLayer(spec, base, {note});
    out.push({ group: spec.group||'gas', key:keyPrefix+(spec.id||spec.file||spec.tiles),
               label:(spec.label||spec.file||spec.tiles)+suffix, icon:ICON.pipe, color, layer });
  }
  return out;
}
// A private overlay still gets one toggle per manifest entry - it is the user's
// own data and there is no way to know how they want it grouped.
const loadLocalLayers = () => loadTierLayers('local/','local/manifest.json',
                                {suffix:' · local', note:'local only, not published', keyPrefix:'local.'});

// one debounced dispatcher for ALL moveend work: collapses wheel-zoom / inertial-pan
// bursts into a single rebuild (each render's token guard drops any straggler).
let _mvT; function onMoveEnd(){ clearTimeout(_mvT); _mvT=setTimeout(()=>{ syncLv(); syncGas(); syncLocal(); if(labelsOn) buildLabels(); writeHash(); }, 150); }
map.on('moveend', onMoveEnd);
// The LV and gas networks only draw when zoomed in; tell the user so they don't
// look broken when toggled on from a wide view.
const lvHint=L.control({position:'bottomleft'});
let lvHintEl=null;
function hintText(){
  const z=map.getZoom(), want=[];
  if(map.hasLayer(lvNetwork)&&z<14) want.push('LV network');
  if(map.hasLayer(gasSvc)&&z<GAS_SVC_MINZOOM) want.push('gas services');
  // Tiled local layers are zoom-gated too, and each tier at its own zoom - say
  // which one is waiting rather than leaving a switched-on layer looking broken.
  for(const g of localGated) if(map.hasLayer(g.layer)&&z<g.minzoom) want.push(g.label.replace(/\s*·.*$/,''));
  // Same for the gas pressure toggles: the mains are z14+, so switching Low
  // pressure on from a regional view used to draw nothing and say nothing.
  for(const g of gasGated){ if(!map.hasLayer(g.layer)) continue;
    const mz=effMinZoom(g.layer); if(mz&&z<mz) want.push(g.label); }
  return want.length?('&#128269; Zoom in to see the '+want.join(' &amp; ')):'';
}
lvHint.onAdd=()=>{lvHintEl=L.DomUtil.create('div','lvhint');lvHintEl.innerHTML=hintText();return lvHintEl;};
function updateLvHint(){
  const txt=hintText();
  if(txt && !lvHint._map) lvHint.addTo(map);
  else if(!txt && lvHint._map) lvHint.remove();
  if(txt && lvHintEl) lvHintEl.innerHTML=txt;
}
// Nothing is added to the map here: every layer starts OFF, so the page opens on
// a clean basemap and the user picks what they want. The LV and gas layers do
// all their fetching from their own 'add' handlers, so while they are off they
// cost nothing at all - no tiles, no transformers, no requests.

// ============================================================================
//  LABEL ENGINE
//  Permanent map labels for named features, with real collision avoidance.
//  The old version bound one tooltip per named HV feature and let them land
//  wherever Leaflet put them, which at any useful zoom meant "Kirkby
//  Substation" written four times on top of itself and every name overlapping
//  its neighbour. What a labelled map actually needs is three things this does
//  and that one did not:
//
//    1. DEDUPE BY NAME. OSM splits a 132 kV line into dozens of ways, each
//       carrying the same name; a named substation is often a polygon plus the
//       transformer points inside it. One name = one label, placed on whichever
//       candidate is nearest the middle of the screen.
//    2. COLLIDE. Candidates are sorted by importance (a 1380 MW station beats
//       an 11 kV pole-mount), then placed greedily: measure the text, try
//       right / left / above / below the anchor, and DROP the label if all four
//       overlap something already placed. Importance-ordered greedy placement
//       is what stops the map deciding to keep the pole-mount and throw away
//       the power station.
//    3. STAY OUT OF THE UI. The layer deck and the title card are registered as
//       exclusion rectangles, so no name is ever half-hidden under a panel.
//
//  Zoom gates are per-feature-importance rather than one global threshold. Power
//  stations can orient a regional view, but substation names are local detail:
//  transmission sites start at z14, 132 kV at z15, primary distribution at z16
//  and minor sites at z17. Text is measured with a real canvas metric, so the
//  collision boxes match what is actually drawn.
// ============================================================================
const LAB_CAP = 220;             // hard ceiling on simultaneously-mounted labels
let labelsOn   = true;           // toggle state (deck default: on)
let labelLayer = null;           // L.layerGroup of permanent tooltips, own pane
let labelPane  = null;
let labelVer   = 0;              // bumped when layer membership changes -> cache drop
const labelSources = [];         // {layer, of:(f,l)->desc|null, cache, ver}

function ensureLabelPane(){
  if(labelPane) return;
  labelPane = map.createPane('mapLabels');
  labelPane.style.zIndex = 645;              // over the data, under popups (700)
  labelPane.style.pointerEvents = 'none';
}

// "132000" -> "132 kV" (multi-valued tags take the highest). '' if unknown.
function kvText(volts){
  const kv = kvOf({voltage:volts});
  if(!kv) return '';
  return (Math.round(kv*10)/10) + ' kV';
}

// ---- text metrics ---------------------------------------------------------
// Measured, not estimated: a collision box that is 20% narrower than the text
// it stands for produces a map that looks fine in code and overlaps on screen.
const _measureCtx = (() => {
  try{ const c=document.createElement('canvas'); return c.getContext?c.getContext('2d'):null; }
  catch(e){ return null; }
})();
const LAB_FONT='700 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif';
const LAB_FONT_BIG='700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif';
const LAB_FONT_SM='600 9.5px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif';
function textWidth(t,font){
  if(_measureCtx){ _measureCtx.font=font; return _measureCtx.measureText(t).width; }
  return String(t).length*(font===LAB_FONT_BIG?6.6:5.6);   // headless fallback
}
const stripTags = s => String(s).replace(/&[a-z]+;/g,'x');

// ---- descriptors ----------------------------------------------------------
// Each source layer turns one of its features into a label descriptor, or null
// for "do not label this". pri = importance (bigger wins a collision), minz =
// the zoom this label is allowed to appear at.
function hvLabelOf(f){
  const p=f.properties||{}; if(!p.name) return null;
  const k=(p.kind||'').toLowerCase(), kv=kvOf(p), st=((p.tags||{}).substation||'').toLowerCase();
  const t=f.geometry&&f.geometry.type||'';
  if(/substation|sub_station|transformer|converter|compensator/.test(k)){
    // one label per substation: the synthetic centre dot carries it, so the
    // footprint polygon and any equipment inside it stay unlabelled
    if(/Polygon/.test(t)) return null;
    if(/transformer/.test(k) && !p._dot) return null;
    const big=kv>=220||/transmission|converter/.test(st);
    return {name:p.name, sub:kvText(p.voltage),
            cls:big?'mlab big':'mlab', pri:(big?900:600)+kv,
            minz: kv>=220||/converter/.test(st) ? 14
                : kv>=100 ? 15
                : kv>=26||/^(distribution|industrial|traction)/.test(st) ? 16 : 17,
            gap: Math.max(4,subRadius(p))+4};
  }
  if(/Point/.test(t)) return null;                      // towers, switches: never named usefully
  // A transmission circuit's ref ("4ZB", "2U") is how it is actually identified
  // on the network, so it belongs on the detail line next to the voltage.
  const ref=(p.tags||{}).ref;
  return {name:p.name, sub:[kvText(p.voltage),ref].filter(Boolean).join(' &middot; '),
          cls:'mlab l', pri:120+kv,
          minz: kv>=220?11 : kv>=100?12 : 14, gap:5};
}
function psLabelOf(f){
  const p=f.properties||{}; if(!p.name||!p._ps) return null;
  const mw=MW(p), out=(p.tags||{})['plant:output:electricity'];
  return {name:p.name, sub:out||'', cls:'mlab big', pri:2000+Math.min(mw,2000),
          minz: mw>=100?9 : mw>=20?11 : 13, gap:psSize(mw)/2+4};
}
// Named sites and runs in the other categories: the pumping stations, works,
// reservoirs and tank farms. Same engine, so a water map labels like the power
// map instead of not at all.
function siteLabelOf(cat){
  return f=>{
    const p=f.properties||{}; if(!p.name) return null;
    const t=f.geometry&&f.geometry.type||'', line=/LineString/.test(t);
    if(/Polygon/.test(t)) return null;                   // labelled via its point, if any
    return {name:p.name, sub:line?'':(p.kind||''), cls:line?'mlab l':'mlab',
            pri:(line?150:320), minz:line?13:12, gap:line?5:7};
  };
}
function registerLabels(layer, of){ if(layer&&of) labelSources.push({layer, of, cache:null, ver:-1}); }

// Descriptors are cached per source layer: the anchors and the text are static,
// only a data merge changes them (labelVer). Placement is what re-runs per pan.
function descriptorsFor(src){
  if(src.cache && src.ver===labelVer) return src.cache;
  const out=[];
  src.layer.eachLayer(l=>{
    const f=l.feature; if(!f) return;
    const d=src.of(f,l); if(!d||!d.name) return;
    let ll=(l.getLatLng&&l.getLatLng());
    if(!ll&&l.getCenter){ try{ ll=l.getCenter(); }catch(e){} }
    if(!ll&&l.getBounds){ try{ ll=l.getBounds().getCenter(); }catch(e){} }
    if(ll) out.push(Object.assign({ll},d));
  });
  src.cache=out; src.ver=labelVer; return out;
}

// Rectangles labels must not land in: the layer deck, the title card, the zoom
// hint. Read from the live DOM so a collapsed deck frees its space back up.
function uiRects(){
  const c=map.getContainer&&map.getContainer();
  if(!c||!c.getBoundingClientRect) return [];
  let host; try{ host=c.getBoundingClientRect(); }catch(e){ return []; }
  const out=[];
  for(const sel of ['.fx-deck','.brand','.lvhint','.leaflet-control-zoom','.leaflet-control-attribution']){
    const el=c.querySelector&&c.querySelector(sel); if(!el||!el.getBoundingClientRect) continue;
    const r=el.getBoundingClientRect();
    if(!r.width) continue;
    out.push({x:r.left-host.left-4,y:r.top-host.top-4,w:r.width+8,h:r.height+8});
  }
  return out;
}
const hits=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;

// Live labels, key -> {tip, ll, dir}. Placement is recomputed on every pan, but
// a label that survives the recompute is LEFT ALONE rather than destroyed and
// rebuilt: a tooltip already tracks its own latlng, so re-creating it buys
// nothing and costs a fade-out/fade-in flicker on every single pan. It also
// keeps a name from hopping to the other side of its dot mid-drag.
const labelLive=new Map();
function dropLabels(){
  for(const [,rec] of labelLive) if(labelLayer) labelLayer.removeLayer(rec.tip);
  labelLive.clear();
}
// Build/refresh the placed label set. The candidate list is already windowed, so
// the work is a few hundred rect tests.
function buildLabels(){
  if(!labelsOn) return;
  ensureLabelPane();
  if(!labelLayer) labelLayer = L.layerGroup([], {pane:'mapLabels'});
  if(!map.hasLayer(labelLayer)) labelLayer.addTo(map);
  const z=map.getZoom();
  if(!(z>=9)){ dropLabels(); return; }
  const b=map.getBounds().pad(0.06);

  // 1. collect candidates from every source layer that is switched on
  const cands=[];
  for(const src of labelSources){
    if(!map.hasLayer(src.layer)) continue;
    for(const d of descriptorsFor(src)){
      if(z<d.minz) continue;
      if(!b.contains(d.ll)) continue;
      cands.push(d);
    }
  }
  if(!cands.length){ dropLabels(); return; }

  // 2. one label per name: OSM splits long lines into many ways and puts the
  //    same name on a substation's polygon and its equipment. Keep the highest
  //    priority instance, and among equals the one nearest the middle of the
  //    screen, which is where the eye already is.
  const mid=map.getCenter(), best=new Map();
  // A physical site may be mapped as several nested voltage compounds with
  // different styling classes. The reader still sees one place, so dedupe by
  // displayed name alone and let priority retain its highest-voltage record.
  const keyOf = d => d.name;
  for(const d of cands){
    const key=keyOf(d);
    const prev=best.get(key);
    if(!prev){ best.set(key,d); continue; }
    if(d.pri>prev.pri){ best.set(key,d); continue; }
    if(d.pri===prev.pri){
      try{ if(mid.distanceTo(d.ll)<mid.distanceTo(prev.ll)) best.set(key,d); }catch(e){}
    }
  }

  // 3. importance-ordered greedy placement
  const order=[...best.values()].sort((a,b2)=>b2.pri-a.pri);
  const placed=uiRects();
  let size; try{ size=map.getSize(); }catch(e){ size={x:1200,y:800}; }
  const want=new Map();
  let n=0;
  for(const d of order){
    const key=keyOf(d), live=labelLive.get(key);
    // a label already on screen keeps its anchor and its side, so panning does
    // not make the names shuffle around under the cursor
    const ll=live?live.ll:d.ll;
    let pt; try{ pt=map.latLngToContainerPoint(ll); }catch(e){ continue; }
    const big=/big/.test(d.cls), quiet=/mlab l/.test(d.cls);
    const font=big?LAB_FONT_BIG:(quiet?LAB_FONT_SM:LAB_FONT);
    const w=Math.ceil(Math.max(textWidth(stripTags(d.name),font),
                               d.sub?textWidth(stripTags(d.sub),LAB_FONT_SM):0))+2;
    const h=d.sub?(big?26:22):(big?15:13);
    const gap=d.gap||6;
    // right, left, above, below - in that order, because a name to the right of
    // its dot is the convention and reads fastest
    const tries=[
      {dir:'right', off:[gap,0],  x:pt.x+gap,      y:pt.y-h/2},
      {dir:'left',  off:[-gap,0], x:pt.x-gap-w,    y:pt.y-h/2},
      {dir:'top',   off:[0,-gap], x:pt.x-w/2,      y:pt.y-gap-h},
      {dir:'bottom',off:[0,gap],  x:pt.x-w/2,      y:pt.y+gap},
    ];
    if(live) tries.sort((a,b2)=>(a.dir===live.dir?-1:0)-(b2.dir===live.dir?-1:0));
    let put=null;
    for(const t of tries){
      const r={x:t.x,y:t.y,w,h};
      if(r.x<2||r.y<2||r.x+r.w>size.x-2||r.y+r.h>size.y-2) continue;   // off-screen
      if(placed.some(p=>hits(r,p))) continue;
      put=t; placed.push(r); break;
    }
    if(!put) continue;                                   // no room: drop it
    want.set(key,{d,ll,dir:put.dir,off:put.off});
    if(++n>=LAB_CAP) break;
  }

  // 4. reconcile: drop what no longer fits, mount only what is genuinely new
  for(const [key,rec] of [...labelLive]){
    if(want.has(key)) continue;
    labelLayer.removeLayer(rec.tip); labelLive.delete(key);
  }
  for(const [key,v] of want){
    if(labelLive.has(key)) continue;
    const tip=L.tooltip({permanent:true, direction:v.dir, offset:v.off, className:v.d.cls,
                         opacity:1, pane:'mapLabels', interactive:false})
      .setLatLng(v.ll)
      .setContent(`${v.d.name}${v.d.sub?`<em>${v.d.sub}</em>`:''}`);
    labelLayer.addLayer(tip);
    labelLive.set(key,{tip, ll:v.ll, dir:v.dir});
  }
}

// public toggle, wired into the deck as cfg.onLabels
function setLabels(on){
  labelsOn = on;
  ensureLabelPane();
  if(!labelLayer) labelLayer = L.layerGroup([], {pane:'mapLabels'});
  if(on) buildLabels();
  else {
    dropLabels();
    labelLayer.clearLayers();
    if(map.hasLayer(labelLayer)) map.removeLayer(labelLayer);
  }
}
// Do not let tooltip text ride Leaflet's animated zoom transform: large labels
// appear to fly across the map even when their final anchor is stable. Hide the
// dedicated label pane for the brief animation, rebuild at the destination and
// reveal it only once every label is in its final place.
map.on('zoomstart',()=>{ if(labelPane) labelPane.style.visibility='hidden'; });
// A zoom change alters every stroke weight and every label gate, so both have to
// re-run; regrade() first, since the labels measure the marker radii it sets.
map.on('zoomend',()=>{
  regrade(); if(labelsOn) buildLabels();
  if(labelPane) labelPane.style.visibility='visible';
});

// ============================================================================
//  SEARCH
//  ~900 named features (substations, power stations, works, reservoirs, tank
//  farms, named lines). A map of this density is nearly unusable without it:
//  "where is Lister Drive" was previously answered by panning and squinting.
//  Indexed from the same layers the labels come from, so anything the map can
//  name, it can find - and the result flies to it and opens its popup.
// ============================================================================
const searchIdx=[], searchExtras=[];
function buildSearchIndex(){
  searchIdx.length=0;
  const seen=new Set();
  for(const src of labelSources){
    src.layer.eachLayer(l=>{
      const f=l.feature; if(!f) return;
      const p=f.properties||{}; if(!p.name) return;
      if(/Polygon/.test(f.geometry&&f.geometry.type||'') ) return;   // its centre point carries it
      const cat=p.cat||'power';
      const key=p.name+'|'+(p.kind||'');
      if(seen.has(key)) return; seen.add(key);
      let ll=(l.getLatLng&&l.getLatLng());
      if(!ll&&l.getCenter){ try{ ll=l.getCenter(); }catch(e){} }
      if(!ll) return;
      const kv=kvText(p.voltage), mw=(p.tags||{})['plant:output:electricity'];
      searchIdx.push({name:p.name, low:p.name.toLowerCase(), cat,
        note:[p.kind,mw||kv].filter(Boolean).join(' &middot; '),
        colour: cat==='power' ? (isDC(p)?KV[0].c:kvBand(kvOf(p)).c) : (CAT[cat]||{}).c,
        ll, layer:src.layer, kv:kvOf(p), mw:mw?parseFloat(mw):0});
    });
  }
  for(const it of searchExtras){
    const key=it.name+'|'+it.ll.lat.toFixed(5)+'|'+it.ll.lng.toFixed(5);
    if(seen.has(key))continue; seen.add(key); searchIdx.push(it);
  }
  // biggest things first, so a bare "s" offers substations before service kiosks
  searchIdx.sort((a,b)=>(b.mw-a.mw)||(b.kv-a.kv)||a.name.localeCompare(b.name));
}
function searchFor(q){
  const s=q.trim().toLowerCase(); if(s.length<2) return [];
  const starts=[], has=[];
  for(const it of searchIdx){
    const i=it.low.indexOf(s);
    if(i===0) starts.push(it); else if(i>0) has.push(it);
    if(starts.length>=9) break;
  }
  return starts.concat(has).slice(0,9);
}
// Flying to a hit is only useful if you can see it, so the layer it lives on is
// switched on if it was off.
function gotoHit(it){
  if(it.layer&&!map.hasLayer(it.layer)) map.addLayer(it.layer);
  map.flyTo(it.ll, Math.max(map.getZoom(),it.zoom||15), {duration:.9});
  map.once('moveend',()=>{
    if(it.open){ it.open(); return; }
    let best=null, bd=Infinity;
    it.layer.eachLayer(l=>{
      const f=l.feature; if(!f||!f.properties||f.properties.name!==it.name) return;
      let ll=(l.getLatLng&&l.getLatLng())||(l.getCenter&&l.getCenter());
      if(!ll) return; const d=ll.distanceTo(it.ll); if(d<bd){bd=d;best={l,f,ll};}
    });
    if(best) L.popup({className:'tt'}).setLatLng(best.ll)
      .setContent(pop(best.f.properties,best.ll.lat,best.ll.lng)).openOn(map);
  });
}

// ============================================================================
//  SHAREABLE VIEW STATE
//  #12.5/53.41/-2.98/power.hv,power.ps - the position AND which layers are on,
//  so a link to "the 400 kV ring around Kirkby" is a link and not a paragraph
//  of instructions. Also means a reload keeps you where you were.
// ============================================================================
const layerRegistry=new Map();       // key -> layer, filled as the deck is built
let hashLock=false;
function writeHash(){
  if(hashLock||!map._loaded) return;
  const c=map.getCenter(), z=map.getZoom();
  const on=[...layerRegistry.entries()].filter(([,l])=>l&&map.hasLayer(l)).map(([k])=>k);
  const h='#'+(Math.round(z*2)/2)+'/'+c.lat.toFixed(4)+'/'+c.lng.toFixed(4)+(on.length?'/'+on.join(','):'');
  if(h!==location.hash){ hashLock=true; try{ history.replaceState(null,'',h); }catch(e){} hashLock=false; }
}
// Returns {z,lat,lng,keys} or null. Applied BEFORE the deck mounts, so the deck
// simply reads map.hasLayer() and lights the right chips - no second code path.
function readHash(){
  const m=/^#(\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)(?:\/(.*))?$/.exec(location.hash||'');
  if(!m) return null;
  return {z:parseFloat(m[1]),lat:parseFloat(m[2]),lng:parseFloat(m[3]),
          keys:(m[4]||'').split(',').filter(Boolean)};
}
// ============================================================================
//  GENERALIZED LayerDeck — N Power-style groups + flat leaves, data-driven.
//  Drop-in replacement for the whole `const LeafLayerDeck = L.Control.extend({...})`
//  block AND its instantiation `new LeafLayerDeck({...}).addTo(map)`.
//  Robust: every child resolves to a real layer (chips with no layer are filtered
//  out -> m.hasLayer(undefined) is impossible). Drawer height via measure()
//  (height:auto), never live scrollHeight -> no padding feedback loop.
// ============================================================================
const LeafLayerDeck = L.Control.extend({
  options:{ position:'topright' },
  initialize:function(cfg, opts){ L.setOptions(this, opts||{}); this._cfg = cfg; },

  onAdd:function(){
    const cfg = this._cfg, m = cfg.map;
    const root = L.DomUtil.create('div','fx-deck');
    L.DomEvent.disableClickPropagation(root);
    L.DomEvent.disableScrollPropagation(root);
    root.innerHTML = this._template(cfg);

    // ---- basemap segmented control ----
    const baseNames = Object.keys(cfg.bases);
    root.querySelectorAll('[data-base]').forEach(el => {
      L.DomEvent.on(el, 'click', () => {
        const name = el.getAttribute('data-base');
        baseNames.forEach(n => { if (m.hasLayer(cfg.bases[n])) m.removeLayer(cfg.bases[n]); });
        cfg.bases[name].addTo(m);
        cfg.bases[name].bringToBack && cfg.bases[name].bringToBack();
        root.querySelectorAll('[data-base]').forEach(b => b.classList.toggle('on', b === el));
        // a dark base needs dark label haloes, or every name on the map vanishes
        cfg.onBase && cfg.onBase(name);
      });
    });

    // ---- search ----
    const q = root.querySelector('[data-find]'), hits = root.querySelector('[data-hits]');
    if (q && hits) {
      let cur = [], sel = -1;
      const paint = () => {
        if (!cur.length) {
          hits.innerHTML = q.value.trim().length < 2 ? ''
            : '<div class="fx-none">Nothing named like that on the map.</div>';
          hits.classList.toggle('on', q.value.trim().length >= 2);
          return;
        }
        hits.innerHTML = cur.map((it, i) =>
          `<button class="fx-hit${i === sel ? ' sel' : ''}" data-hit="${i}" style="--c:${it.colour || '#888'}">`
          + `<i></i><span>${it.name}</span><small>${it.note || ''}</small></button>`).join('');
        hits.classList.add('on');
        hits.querySelectorAll('[data-hit]').forEach(btn => L.DomEvent.on(btn, 'click', () => {
          const it = cur[+btn.getAttribute('data-hit')];
          if (!it) return;
          q.value = ''; cur = []; sel = -1; hits.classList.remove('on'); hits.innerHTML = '';
          gotoHit(it);
          if(window.matchMedia&&window.matchMedia('(max-width: 680px)').matches)
            root.classList.add('collapsed');
        }));
      };
      L.DomEvent.on(q, 'input', () => { cur = searchFor(q.value); sel = -1; paint(); });
      L.DomEvent.on(q, 'keydown', e => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          if (!cur.length) return;
          L.DomEvent.preventDefault(e);
          sel = e.key === 'ArrowDown' ? (sel + 1) % cur.length
                                      : (sel <= 0 ? cur.length : sel) - 1;
          paint();
        } else if (e.key === 'Enter') {
          const it = cur[sel < 0 ? 0 : sel];
          if (it) { q.value = ''; cur = []; sel = -1; hits.classList.remove('on'); hits.innerHTML = ''; gotoHit(it);
            if(window.matchMedia&&window.matchMedia('(max-width: 680px)').matches)root.classList.add('collapsed'); }
        } else if (e.key === 'Escape') { q.value = ''; cur = []; sel = -1; hits.classList.remove('on'); hits.innerHTML = ''; q.blur(); }
      });
      // "/" focuses search from anywhere, the convention everywhere else
      if (document.addEventListener) document.addEventListener('keydown', e => {
        if (e.key === '/' && document.activeElement !== q) {
          const t = document.activeElement, tag = (t && t.tagName) || '';
          if (/INPUT|TEXTAREA/.test(tag)) return;
          e.preventDefault(); root.classList.remove('collapsed'); q.focus();
        }
      });
    }

    // ---- flat leaves (Trains) ----
    cfg.leaves.forEach(leaf => {
      const chip = root.querySelector('.fx-chip[data-leaf="'+leaf.key+'"]');
      if(!chip || !leaf.layer) return;                 // robustness: never wire undefined
      chip.classList.toggle('on', m.hasLayer(leaf.layer));
      L.DomEvent.on(chip, 'click', () => this._toggle(chip, leaf.layer, m));
    });

    // ---- groups ----
    cfg.groups.forEach(g => this._wireGroup(root, m, cfg, g));

    // ---- collapsible whole deck: tap the header to hide everything but the pill.
    //      Collapsed by default on small screens so the panel doesn't cover the map.
    const head = root.querySelector('[data-deckhead]');
    if (head) {
      L.DomEvent.on(head, 'click', () => {
        const collapsed = root.classList.toggle('collapsed');
        head.setAttribute('aria-expanded', String(!collapsed));
      });
      if (window.matchMedia && window.matchMedia('(max-width: 680px)').matches) {
        root.classList.add('collapsed');
        head.setAttribute('aria-expanded', 'false');
      }
    }
    return root;
  },

  _toggle:function(chip, layer, m){
    if(!layer) return;
    if (m.hasLayer(layer)) { m.removeLayer(layer); chip.classList.remove('on'); }
    else {
      m.addLayer(layer); chip.classList.add('on');
      chip.classList.add('pulse'); setTimeout(() => chip.classList.remove('pulse'), 440);
    }
  },

  // ---- generic group wiring (refactor of the old _wirePower) ------------------
  _wireGroup:function(root, m, cfg, g){
    const group  = root.querySelector('[data-group="'+g.key+'"]');
    const parent = group.querySelector('.fx-chip.parent');
    const drawer = group.querySelector('.fx-subs');
    // children that actually resolved to a layer (defensive)
    const kids = g.children
      .map(c => ({ def:c, chip:group.querySelector('.fx-chip[data-child="'+c.key+'"]') }))
      .filter(o => o.chip && o.def.layer);

    // measure natural content height at height:auto (NOT live scrollHeight, which
    // double-counts padding and never shrinks -> the historical drawer-growth bug).
    const measure = () => { const p=drawer.style.height; drawer.style.height='auto'; const h=drawer.scrollHeight; drawer.style.height=p; return h; };
    const reflow  = () => { if (group.classList.contains('open')) drawer.style.height = measure() + 'px'; };

    const refreshParent = () => {
      let on=0; const total=kids.length;
      kids.forEach(k => { const is=m.hasLayer(k.def.layer); k.chip.classList.toggle('on', is); if(is) on++; });
      parent.classList.remove('on','partial');
      if (on===total && total>0) parent.classList.add('on');
      else if (on>0)             parent.classList.add('partial');
      // the .fx-rag legend is visible only while the layer it describes is on:
      // LV capacity for power, pressure tiers for gas
      const legend = group.querySelector('[data-rag]');
      if (legend) {
        // gas passes an ARRAY (one layer per pressure): the legend belongs on
        // screen as soon as any one of them is showing.
        const gate = g.key === 'gas' ? cfg.gasMains : cfg.lvNetwork;
        const lit = Array.isArray(gate) ? gate.some(l => l && m.hasLayer(l))
                                        : (!!gate && m.hasLayer(gate));
        legend.classList.toggle('is-on', lit);
      }
      reflow();
    };

    const setOpen = (o) => {
      group.classList.toggle('open', o);
      drawer.style.height = o ? measure() + 'px' : '0px';
    };

    const disc = parent.querySelector('.fx-disc');
    // chevron (right) = expand / collapse to reveal the group's individual layers.
    // stops propagation so it never also toggles the group on/off.
    L.DomEvent.on(disc, 'click', (e) => {
      L.DomEvent.stop(e);
      const open = !group.classList.contains('open');
      setOpen(open);
      disc.setAttribute('aria-expanded', String(open));
    });
    // tapping the row (puck OR label) enables / disables the whole group — the
    // primary, obvious action. Expansion is a separate concern (the chevron).
    L.DomEvent.on(parent, 'click', () => {
      const anyOn = kids.some(k => m.hasLayer(k.def.layer));
      if (anyOn) kids.forEach(k => { if(m.hasLayer(k.def.layer)) m.removeLayer(k.def.layer); });
      else       kids.forEach(k => { if(!m.hasLayer(k.def.layer)) m.addLayer(k.def.layer); });
      parent.classList.add('pulse'); setTimeout(() => parent.classList.remove('pulse'), 440);
      refreshParent();
    });
    // individual children
    kids.forEach(k => L.DomEvent.on(k.chip, 'click', () => { this._toggle(k.chip, k.def.layer, m); refreshParent(); }));
    // Search and hash restoration can change a layer without clicking its chip.
    // Keep the deck truthful whichever path changed the map.
    kids.forEach(k => k.def.layer.on && k.def.layer.on('add remove', refreshParent));

    // ---- extras inside this group's drawer ----
    // Map-labels toggle (always visible; sits OUTSIDE the LV-gated .fx-rag block)
    const labtog = group.querySelector('[data-labtog]');
    if (labtog) L.DomEvent.on(labtog, 'click', (e) => {
      L.DomEvent.stop(e);
      const on = !labtog.classList.contains('on');
      labtog.classList.toggle('on', on);
      labtog.setAttribute('aria-checked', String(on));
      cfg.onLabels && cfg.onLabels(on);
      reflow();
    });
    // Gas pressure-tier toggle: same shape as the LV capacity switch below
    const presstog = group.querySelector('[data-presstog]');
    if (presstog) L.DomEvent.on(presstog, 'click', (e) => {
      L.DomEvent.stop(e);
      const on = !presstog.classList.contains('on');
      presstog.classList.toggle('on', on);
      presstog.setAttribute('aria-checked', String(on));
      const legend = group.querySelector('[data-rag]');
      if (legend) legend.classList.toggle('cap-on', on);
      cfg.onPressure && cfg.onPressure(on);
      reflow();
    });
    // LV capacity toggle (inside .fx-rag; unchanged behaviour)
    const captog = group.querySelector('[data-captog]');
    if (captog) L.DomEvent.on(captog, 'click', (e) => {
      L.DomEvent.stop(e);
      const on = !captog.classList.contains('on');
      captog.classList.toggle('on', on);
      captog.setAttribute('aria-checked', String(on));
      const legend = group.querySelector('[data-rag]');
      if (legend) legend.classList.toggle('cap-on', on);
      cfg.onCapacity && cfg.onCapacity(on);
      reflow();
    });

    refreshParent();
    // Open a drawer if the group has anything switched on (so a shared #hash link
    // shows you which of its layers are lit), and keep Power open regardless —
    // its drawer holds the labels toggle, the voltage key and the LV controls.
    requestAnimationFrame(() => {
      const open = g.key === 'power' || kids.some(k => m.hasLayer(k.def.layer));
      setOpen(open); disc.setAttribute('aria-expanded', String(open));
    });
  },

  _chip:function(key, label, icon, color, attr){
    return `<button class="fx-chip" ${attr}="${key}" style="--c:${color}">
      <span class="fx-puck">${icon}</span>
      <span class="fx-name">${label}</span>
      <span class="fx-bar"></span>
      <span class="fx-tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-12"/></svg></span>
    </button>`;
  },

  // per-group extras HTML. HV-labels toggle is rendered BEFORE the .fx-rag block
  // so it stays visible regardless of LV state. Gas gets the same .fx-rag
  // treatment for its pressure-tier legend, gated on the mains layer.
  _extrasHtml:function(g){
    if (g.key === 'gas') return `
      <div class="fx-rag cap-on" data-rag>
        <button class="fx-cap on" data-presstog role="switch" aria-checked="true"><span class="fx-cap-sw"></span>Colour pipes by pressure</button>
        <div class="fx-rag-legend">
          <div class="fx-rag-rows">
            <span><i style="background:${GAS_COL.LP}"></i>Low &le;75 mbarg</span>
            <span><i style="background:${GAS_COL.MP}"></i>Medium &le;2 barg</span>
            <span><i style="background:${GAS_COL.IP}"></i>Intermediate &le;7 barg</span>
            ${(localTiers.has('HPL')||localTiers.has('HPN'))
              ? `<span><i style="background:${GAS_COL.HPL}"></i>High &gt;7 barg &middot; local</span>
                 <span><i style="background:${GAS_COL.HPN}"></i>High &gt;7 barg &middot; national</span>`
              : `<span><i style="background:${GAS_COL.HP}"></i>High &gt;7 barg</span>`}
          </div>
        </div>
      </div>`;
    if (g.key !== 'power') return '';
    // The voltage key. Each swatch is drawn at the band's real relative stroke
    // weight, so the legend teaches both halves of the encoding at once: the map
    // says "heavier and redder means higher", and so does this.
    const kvKey = KV.map(b =>
      `<div class="fx-key-row"><i class="fx-key-sw" style="border-top-width:${Math.max(1.5,b.w).toFixed(1)}px;border-top-color:${b.c}"></i><b>${b.label}</b></div>`
    ).join('');
    return `
      <button class="fx-cap fx-labtog on" data-labtog role="switch" aria-checked="true"><span class="fx-cap-sw"></span>Map labels (names, kV, MW)</button>
      <div class="fx-key">${kvKey}</div>
      <div class="fx-rag cap-on" data-rag>
        <div class="fx-rag-tx"><i style="background:#FFC400;border-color:#3A2E00"></i>Transformer (substation)</div>
        <button class="fx-cap on" data-captog role="switch" aria-checked="true"><span class="fx-cap-sw"></span>Colour cables by capacity</button>
        <div class="fx-rag-legend">
          <div class="fx-rag-bar"></div>
          <div class="fx-rag-rows">
            <span><i style="background:${FX_RAGC.g}"></i>Spare</span>
            <span><i style="background:${FX_RAGC.a}"></i>Limited</span>
            <span><i style="background:${FX_RAGC.r}"></i>At capacity</span>
          </div>
        </div>
      </div>`;
  },

  _groupHtml:function(g){
    const childChips = g.children
      .map(c => this._chip(c.key, c.label, c.icon, c.color, 'data-child')).join('\n');
    return `
      <div class="fx-group" data-group="${g.key}">
        <button class="fx-chip parent" style="--c:${g.color}">
          <span class="fx-puck">${g.icon}</span>
          <span class="fx-name">${g.label}</span>
          <span class="fx-disc" title="Show ${g.label} sub-layers" aria-label="Show ${g.label} sub-layers" aria-expanded="false">${CHEV}</span>
        </button>
        <div class="fx-subs">
          ${childChips}
          ${this._extrasHtml(g)}
        </div>
      </div>`;
  },

  _template:function(cfg){
    const baseChips = Object.keys(cfg.bases).map((n,i) =>
      `<button class="fx-base${(n===cfg.baseDefault)||(cfg.baseDefault==null&&i===0)?' on':''}" data-base="${n}" title="${n}">${n.replace(/\s*\(.*\)$/,'').replace('Satellite + labels','Sat + labels')}</button>`
    ).join('');
    const groupsHtml = cfg.groups.map(g => this._groupHtml(g)).join('\n');
    const leafChips  = cfg.leaves.map(l => this._chip(l.key, l.label, l.icon, l.color, 'data-leaf')).join('\n');
    return `
      <button class="fx-head" data-deckhead aria-expanded="true" title="Show / hide the layers panel">
        <span class="fx-title">Layers</span>
        <span class="fx-collapse">${CHEV}</span>
      </button>
      <div class="fx-find">
        ${ICON.find}
        <input type="search" data-find placeholder="Search sites &amp; lines  /" autocomplete="off"
               spellcheck="false" aria-label="Search named infrastructure"/>
      </div>
      <div class="fx-hits" data-hits></div>
      <div class="fx-hint">Tap a group to <b>show / hide</b> it &middot; <b>&#9662;</b> opens its individual layers &middot; press <b>/</b> to search</div>
      <div class="fx-eyebrow">Basemap</div>
      <div class="fx-seg">${baseChips}</div>
      <div class="fx-eyebrow">Overlays</div>
      <div class="fx-chips">
        ${groupsHtml}
        ${leafChips}
      </div>`;
  },
});

// ============================================================================
//  initData(): everything that needs the feature data. Called once data.json is
//  fetched. Builds the sub-layers in a SINGLE pass over the features, adds the
//  the sub-layers (all off), merges extra_infra, then configures + mounts the control.
// ============================================================================
async function initData(fc){
  data = fc;
  // load the committed MAPS extract and any private overlay before the deck
  // mounts. Either fetch that 404s degrades to null / an empty array and simply
  // contributes no layers.
  const [mapsGas,localLayers,mapsAgiData] = await Promise.all([
    buildMapsGas(), loadLocalLayers(), fetchManifest('tiles/mapsgeo/agi.geojson')
  ]);

  // bbox-midpoint of any geometry, without allocating a throwaway L.geoJSON layer
  // (identical result to L.geoJSON(f).getBounds().getCenter()).
  const featCenter = f => {
    let mnx=Infinity,mny=Infinity,mxx=-Infinity,mxy=-Infinity;
    (function walk(a){ if(typeof a[0]==='number'){ const x=a[0],y=a[1];
        if(x<mnx)mnx=x; if(x>mxx)mxx=x; if(y<mny)mny=y; if(y>mxy)mxy=y; }
      else for(const c of a) walk(c); })(f.geometry.coordinates);
    return L.latLng((mny+mxy)/2,(mnx+mxx)/2);
  };

  const GROUPED = Object.keys(SUBKEYS);                     // power,fuel,gas,water,sewage
  // embedded data carries power=plant (kind "plant"); skip those so the extra_infra
  // power stations (name + MW output) are what we render.
  const isEmbeddedPlant = f => f.properties.cat==="power" && /plant/.test((f.properties.kind||"").toLowerCase());

  // A substation is drawn as its footprint, but a footprint is 20 m across: at
  // any regional zoom it is a sub-pixel smudge, which is why the old map showed
  // 2000 pole-top towers and not one grid substation. So every substation
  // polygon also gets a synthetic centre POINT - that is the dot you see and
  // click at a wide view, and the anchor its label hangs off; the footprint
  // takes over once you are close enough for it to have an extent. Same
  // treatment the gas AGI outlines already get, for the same reason.
  // Power-station polygons get the equivalent, flagged _ps so they render as a
  // generation badge rather than a dot.
  const centreOf = f => { const c=featCenter(f); return {type:'Feature',
    properties:Object.assign({},f.properties,{_dot:true}),
    geometry:{type:'Point',coordinates:[c.lng,c.lat]}}; };
  const isSubPoly = f => /Polygon/.test(f.geometry&&f.geometry.type||'')
    && /substation|sub_station|converter|compensator/.test((f.properties.kind||'').toLowerCase());

  // ---- SINGLE pass: bucket every grouped-cat feature; collect train + traction ----
  const buckets={}; GROUPED.forEach(cat=>SUBKEYS[cat].forEach(k=>buckets[k]=[]));
  const trainFeats=[], tractionFeats=[];
  for(const f of data.features){
    const cat=f.properties.cat;
    if(cat==='train'){ trainFeats.push(f); if(f.properties.traction) tractionFeats.push(f); continue; }
    if(SUBKEYS[cat] && !isEmbeddedPlant(f)){
      const k=subKeyFor(cat,f);
      buckets[k].push(f);
      if(isSubPoly(f)) buckets[k].push(centreOf(f));
    }
  }
  GROUPED.forEach(cat=>SUBKEYS[cat].forEach(k=>{
    sub[k] = k==='power.ps' ? psLayer(buckets[k]) : subLayer(cat,buckets[k]);
  }));
  layers.train = subLayer('train', trainFeats);
  tractionFeats.forEach(f=>{
    const c=featCenter(f);
    L.circleMarker(c,{radius:6,color:'#fff',weight:1.6,fillColor:'#00A896',fillOpacity:1})
      .bindPopup(pop(f.properties,c.lat,c.lng),{className:'tt'}).addTo(layers.train);
  });

  // ---- labels: register every layer that has names worth drawing ----
  registerLabels(sub['power.hv'], hvLabelOf);
  registerLabels(sub['power.ps'], psLabelOf);
  ['water.site','sewage.site','fuel.tank','gas.hold','water.pipe','fuel.pipe','gas.pipe','sewage.pipe']
    .forEach(k => registerLabels(sub[k], siteLabelOf(k.split('.')[0])));

  // ---- every layer starts OFF; the deck adds them on demand. ----
  // Labels belong to the layers they name, so rebuild them the moment one is
  // switched on or off rather than waiting for a pan.
  Object.keys(sub).forEach(k => sub[k] &&
    sub[k].on('add remove', () => { if(labelsOn) buildLabels(); }));

  // ---- runtime extra_infra merge: route each feature into its SUB-layer ----
  const _extraIds=new Set(data.features.filter(f=>!isEmbeddedPlant(f)).map(f=>f.properties.id));
  fetch('extra_infra.geojson').then(r=>r.json()).then(ex=>{
    for(const f of ex.features){
      const p=f.properties; if(_extraIds.has(p.id))continue; _extraIds.add(p.id);
      if(p.cat==='train'){ layers.train.addData(f); continue; }
      const k = subKeyFor(p.cat,f);
      if(!k || !sub[k]) continue;                 // guarded: never addData on undefined
      sub[k].addData(f);
      // the power stations arrive here, and this is where they get their badge
      if(k==='power.ps'){
        const c=featCenter(f);
        sub[k].addData({type:'Feature',
          properties:Object.assign({},p,{_ps:true}),
          geometry:{type:'Point',coordinates:[c.lng,c.lat]}});
      } else if(isSubPoly(f)) sub[k].addData(centreOf(f));
    }
    labelVer++;                                    // membership changed: drop label caches
    buildSearchIndex();
    if(labelsOn) buildLabels();
  }).catch(()=>{});

// The gas drawer is organised by PRESSURE, because that is the question people
// actually bring to it - what is under this street, and how hard is it pushing.
// A single "Mains" toggle hiding four tiers, plus a separate "Transmission"
// layer that is just the high-pressure end of the same network, made the list
// unreadable.
//
// Each tier draws from every source that has it, so a toggle is a statement
// about the gas rather than about where the data came from:
//   MAPS extract   surveyed, wherever it reaches
//   Cadent open    the same tier, clipped to OUTSIDE the MAPS envelope so no
//                  pipe is ever drawn twice (LP/MP only - GPI Open has no IP/HP)
//   OSM            the transmission ways, which are high pressure by definition
const grp = (...ls) => { const a = ls.filter(Boolean); return a.length ? L.layerGroup(a) : null; };
const mt = (mapsGas && mapsGas.mainsByTier) || {};
// Cadent mains of one tier, outside the MAPS envelope. `p` is Cadent's own
// pressure code.
const cadentTier = (...codes) =>
  gasTileLayer('main', GAS_MAIN_MINZOOM, f => codes.includes((f.properties||{}).p)
    ? clipOutsideMaps(f) : []);

const gasHigh  = grp(mt.HPN, mt.HPL, cadentTier('HP'), gasTrans, sub['gas.pipe']);
const gasInter = grp(mt.IP,  cadentTier('IP'));
const gasMed   = grp(mt.MP,  cadentTier('MP'));
const gasLow   = grp(mt.LP,  cadentTier('LP','UN'));
const gasPressureLayers = [gasHigh, gasInter, gasMed, gasLow].filter(Boolean);
// One user-facing AGI layer: Cadent markers plus MAPS labels and footprints.
// MAPS plant symbols are intentionally omitted: proximity to a site does not
// prove a valve/fitting is above ground, and they recreate the duplicate-marker
// clutter this layer is designed to remove.
const gasInstallations=gasAgSites;
for(const f of (mapsAgiData&&mapsAgiData.features)||[]){
  const p=f.properties||{}, name=String(p.label||'').trim(); if(!name)continue;
  const ll=featCenter(f);
  searchExtras.push({name,low:name.toLowerCase(),cat:'gas',
    note:'AGI &middot; '+ll.lat.toFixed(3)+', '+ll.lng.toFixed(3),
    colour:GAS_AG_COL,ll,zoom:18,layer:gasInstallations,
    open:()=>L.popup({className:'tt'}).setLatLng(ll).setContent(card({
      color:GAS_AG_COL,icon:ICON.station,kicker:'Above-ground gas site',name,
      meta:'National Grid MAPS &middot; '+(p.note||'as annotated on the surveyed plan'),
      rows:rowsOf([['extent',p.bounded?'surveyed outline':'label only'],
                   ['surveyed',p.surveyed?String(p.surveyed).replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3'):null]]),
      lat:ll.lat,lon:ll.lng})).openOn(map)});
}
// each pressure toggle, so the zoom hint can name whichever one is still waiting
[[gasHigh,'high-pressure mains'],[gasInter,'intermediate-pressure mains'],
 [gasMed,'medium-pressure mains'],[gasLow,'low-pressure mains']]
  .forEach(([l,label])=>{ if(l){ gasGated.push({layer:l,label}); l.on('add remove',updateLvHint); } });

const GROUPS = [
  { key:'power', label:'Power', color:FX.hv, icon:ICON.hv, children:[
      { key:'power.hv', label:'HV network',     icon:ICON.hv,      color:FX.hv,     layer:sub['power.hv'] },
      { key:'power.ps', label:'Power stations', icon:ICON.station, color:FX.power,  layer:sub['power.ps'] },
      { key:'power.lv', label:'LV network',     icon:ICON.lv,      color:FX.lv,     layer:lvNetwork } ] },
  { key:'fuel', label:'Oil &amp; chemicals', color:FX.fuel, icon:ICON.fuel, children:[
      { key:'fuel.pipe', label:'Pipelines',  icon:ICON.pipe, color:FX.fuel, layer:sub['fuel.pipe'] },
      { key:'fuel.tank', label:'Tank farms', icon:ICON.tank, color:FX.fuel, layer:sub['fuel.tank'] } ] },
  { key:'gas', label:'Gas', color:FX.gas, icon:ICON.gas, children:[
      // by pressure, biggest first - the barg ranges are in the label because
      // "high" and "medium" mean nothing without them
      { key:'gas.hp',     label:'High &gt;7 barg',        icon:ICON.pipe,    color:GAS_COL.HPL, layer:gasHigh },
      { key:'gas.ip',     label:'Intermediate &le;7 barg',icon:ICON.pipe,    color:GAS_COL.IP,  layer:gasInter },
      { key:'gas.mp',     label:'Medium &le;2 barg',      icon:ICON.pipe,    color:GAS_COL.MP,  layer:gasMed },
      { key:'gas.lp',     label:'Low &le;75 mbarg',       icon:ICON.pipe,    color:GAS_COL.LP,  layer:gasLow },
      // then the things that are not pipe runs
      { key:'gas.svc',    label:'Services to premises',   icon:ICON.pipe,    color:GAS_SVC_COL, layer:gasSvc },
      { key:'gas.agi',    label:'Above-ground sites (AGI)',icon:ICON.station,color:GAS_AG_COL, layer:gasInstallations },
      { key:'gas.agpipe', label:'Above-ground pipes',     icon:ICON.pipe,    color:GAS_AG_COL,  layer:gasAgPipes },
      { key:'gas.hold',   label:'Gas holders',            icon:ICON.gas,     color:FX.gas,      layer:sub['gas.hold'] } ] },
  { key:'water', label:'Water', color:FX.water, icon:ICON.water, children:[
      { key:'water.site', label:'Sites',     icon:ICON.water, color:FX.water, layer:sub['water.site'] },
      { key:'water.pipe', label:'Pipelines', icon:ICON.pipe,  color:FX.water, layer:sub['water.pipe'] } ] },
  { key:'sewage', label:'Sewage', color:FX.sewage, icon:ICON.sewage, children:[
      { key:'sewage.site', label:'Sites',     icon:ICON.sewage, color:FX.sewage, layer:sub['sewage.site'] },
      { key:'sewage.pipe', label:'Pipelines', icon:ICON.pipe,   color:FX.sewage, layer:sub['sewage.pipe'] } ] },
].map(g => ({...g, children: g.children.filter(c => c.layer)}));   // drop any child whose layer is missing

// Fold local-only layers into their target group (default gas). Only ever
// non-empty on a local checkout; the public deploy has no manifest.
for(const ll of localLayers){
  const g = GROUPS.find(x => x.key === ll.group) || GROUPS.find(x => x.key === 'gas');
  if(g) g.children.push({ key:ll.key, label:ll.label, icon:ll.icon, color:ll.color, layer:ll.layer });
}

const LEAVES = [ { key:'train', label:'Trains', icon:ICON.train, color:FX.train, layer:layers.train } ];

// Every toggleable layer, keyed, so a view can be described in a URL and
// restored from one. Registered before the deck mounts because the deck reads
// map.hasLayer() to decide which chips are lit - one code path, not two.
for(const g of GROUPS) for(const c of g.children) layerRegistry.set(c.key, c.layer);
for(const l of LEAVES) layerRegistry.set(l.key, l.layer);

// ---- opening view ---------------------------------------------------------
// A #hash wins; otherwise the map opens with the HV network and the power
// stations on. An empty basemap is a worse first impression than a slightly
// busier one, and these two are already-loaded local data, so switching them on
// costs no requests. Everything tiled (LV, gas, services) still starts off.
const restored = readHash();
if(restored && restored.keys.length){
  for(const k of restored.keys){ const l=layerRegistry.get(k); if(l) map.addLayer(l); }
}else{
  for(const k of ['power.hv','power.ps']){ const l=layerRegistry.get(k); if(l) map.addLayer(l); }
}

new LeafLayerDeck({
  map, bases, baseDefault:BASE_DEFAULT,
  groups: GROUPS,
  leaves: LEAVES,
  lvNetwork,
  gasMains: gasPressureLayers,   // gates the pressure legend on any tier being on
  onCapacity: setLvCapacity,
  onLabels: setLabels,
  onPressure: setGasPressure,
  onBase: setBaseTheme,
}).addTo(map);

  // A small console handle. Everything else on the page is closed over inside
  // this one script, which makes "why is that layer not drawing" unanswerable
  // from devtools; this costs nothing and makes the map pokeable.
  window.MIM={map,layers:layerRegistry,bases,search:searchFor,goto:gotoHit,
              data:{mapsBounds:()=>mapsBounds,clipOutsideMaps},
              labels:{build:buildLabels,set:setLabels,sources:labelSources},
              style:{KV,kvOf,powerStyle,zoom:()=>({zMul,zBand})}};

  buildSearchIndex();
  buildLabels();
  // the deck panel is an exclusion zone for labels, so re-place them once it has
  // actually been laid out and has a measurable width
  setTimeout(()=>{ if(labelsOn) buildLabels(); },60);
  map.on('layeradd layerremove', ()=>{ clearTimeout(_hashT); _hashT=setTimeout(writeHash,220); });
  writeHash();

  // data + layers are in: drop the loading overlay. Deliberately a timer and not
  // requestAnimationFrame: rAF is throttled to nothing in a background tab, so a
  // load that finishes while the tab is hidden would leave the splash up.
  const boot=document.getElementById('boot');
  if(boot){ boot.style.transition='opacity .35s';
            setTimeout(()=>{ boot.style.opacity='0'; setTimeout(()=>boot.remove(),380); },20); }
}
let _hashT;


// Title card. Carries the one convention that is not self-evident from the map
// (solid = overground, dashed = underground) drawn as the actual strokes rather
// than described in words.
const title=L.control({position:'topleft'});
title.onAdd=()=>{const d=L.DomUtil.create('div','brand');
  d.innerHTML='<h1>Merseyside Infrastructure</h1>'
    +'<p><i></i>overground <i class="d"></i>underground</p>';
  return d;};
title.addTo(map);

// The attribution is six sources long and legally has to stay, but it does not
// have to be a banner across the bottom of the map. Collapsed to a marker that
// expands on click - same information, none of the real estate.
map.on('load layeradd',function once(){
  const el=document.querySelector('.leaflet-control-attribution');
  if(!el||el._folded) return; el._folded=true;
  const body=el.innerHTML;
  el.classList.add('attr-min');
  el.innerHTML='<span class="attr-toggle" title="Sources &amp; licences">&#9432;</span>'
    +'<span class="attr-body"> '+body+'</span>';
  const t=el.querySelector('.attr-toggle');
  if(t) L.DomEvent.on(t,'click',e=>{ L.DomEvent.stop(e); el.classList.toggle('attr-min'); });
  if(el) L.DomEvent.disableClickPropagation(el);
});

// ---- load the externalized data, then build the layers + control ----
fetch('data.json').then(r=>r.json()).then(initData).catch(err=>{
  console.error('Failed to load data.json', err);
  const b=document.getElementById('boot');
  if(b) b.innerHTML='<div style="text-align:center"><b>Could not load the map data.</b>'
    +'<div style="font-weight:500;color:#64748b;margin-top:6px">data.json failed to fetch &mdash; check the console.</div></div>';
});
</script></body></html>
