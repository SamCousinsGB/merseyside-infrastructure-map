<!DOCTYPE html><html><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Merseyside Infrastructure Map</title>
<meta name="description" content="Interactive map of Merseyside &amp; North Wales infrastructure: power (HV/LV), water, gas, oil &amp; chemicals, sewage and rail."/>
<meta name="theme-color" content="#6A2FBF"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
/* ---------------------------------------------------------------------------
   Design tokens. The layer deck's look (white cards, 16px radius, soft
   shadows, purple accent) is the house style; everything else on the map -
   zoom buttons, popups, legend, labels - is built from these same tokens so
   the whole page reads as one object rather than Leaflet defaults with a
   panel bolted on.
   --------------------------------------------------------------------------- */
:root{
  --bg:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#eef1f5; --sunk:#f5f7fa;
  --accent:#6A2FBF; --radius:16px;
  --shadow:0 6px 26px -6px rgba(15,23,42,.28), 0 2px 6px rgba(15,23,42,.10);
  --shadow-sm:0 2px 10px -4px rgba(15,23,42,.22);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --halo:#fff;                 /* label halo; flipped on dark basemaps */
}
html,body,#map{height:100%;margin:0}
#map{width:100%;background:#eef2f6}
.leaflet-control-layers{display:none}
.leaflet-container{font-family:var(--font)}

/* Dark basemaps: the page keeps its light chrome (cards stay white and
   legible) but anything drawn ON the tiles - label haloes, the graticule of
   thin lines - has to invert or it disappears. Driven by a .dark class the
   basemap switcher puts on the map container. */
.dark #map,#map.dark{background:#12161c}
.dark{--halo:#0b0f14}

/* ---- zoom + scale: Leaflet's default grey boxes replaced by deck-style cards */
.leaflet-touch .leaflet-bar,.leaflet-bar{border:none!important;box-shadow:var(--shadow-sm)!important;
  border-radius:12px!important;overflow:hidden;background:var(--bg)}
.leaflet-bar a,.leaflet-bar a:hover{width:32px;height:32px;line-height:32px;color:var(--muted);
  border:none;border-bottom:1px solid var(--line);background:var(--bg);font-size:17px;font-weight:400;
  transition:background .16s,color .16s}
.leaflet-bar a:last-child{border-bottom:none}
.leaflet-bar a:hover{background:var(--sunk);color:var(--ink)}
.leaflet-bar a.leaflet-disabled{color:#cbd5e1;background:var(--bg)}
.leaflet-control-scale-line{border:none!important;border-radius:6px;background:rgba(255,255,255,.78);
  backdrop-filter:blur(6px);color:var(--muted);font:600 10px/1.5 var(--font);padding:1px 6px;
  box-shadow:0 1px 3px rgba(15,23,42,.14)}
.leaflet-control-attribution{background:rgba(255,255,255,.8)!important;backdrop-filter:blur(6px);
  border-radius:8px 0 0 0;color:var(--muted)!important;font:400 9.5px/1.5 var(--font);padding:2px 7px!important;
  max-width:min(72vw,700px)}
.leaflet-control-attribution a{color:var(--muted)!important;text-decoration:none}
.leaflet-control-attribution a:hover{text-decoration:underline}
.leaflet-control-attribution .attr-toggle{cursor:pointer;font-weight:700;color:var(--ink)!important;
  padding:0 2px}
.leaflet-control-attribution.attr-min .attr-body{display:none}

/* interactive geometry gets a pointer, so it is discoverable that lines click */
.leaflet-interactive{cursor:pointer}

.fx-deck{
  --bg:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#eef1f5;
  --accent:#6A2FBF; --radius:16px;
  box-sizing:border-box;
  width:236px; background:var(--bg); color:var(--ink);
  border-radius:var(--radius); padding:10px;
  box-shadow:0 6px 26px -6px rgba(15,23,42,.28), 0 2px 6px rgba(15,23,42,.10);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; user-select:none;
  /* never exceed the viewport; scroll internally. disableScrollPropagation (JS)
     already stops the wheel from zooming the map while the pointer is over the deck. */
  max-height:calc(100vh - 20px); overflow-y:auto; overflow-x:hidden;
  overscroll-behavior:contain; scrollbar-gutter:stable;
  scrollbar-width:thin; scrollbar-color:#cbd2dc transparent;
  animation:fx-in .28s cubic-bezier(.16,1,.3,1) both;
}
.fx-deck::-webkit-scrollbar{width:8px}
.fx-deck::-webkit-scrollbar-track{background:transparent}
.fx-deck::-webkit-scrollbar-thumb{background:#cbd2dc;border-radius:8px;border:2px solid var(--bg)}
.fx-deck::-webkit-scrollbar-thumb:hover{background:#aab3c0}
@keyframes fx-in{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.fx-head{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  border:none;background:transparent;color:inherit;font:inherit;cursor:pointer;padding:2px 4px 6px}
.fx-title{font-weight:700;letter-spacing:.3px;font-size:13px}
.fx-collapse{flex:0 0 auto;display:grid;place-items:center;width:22px;height:22px;border-radius:7px;
  color:var(--muted);transition:transform .26s cubic-bezier(.4,0,.2,1),background .18s,color .18s}
.fx-collapse svg{width:16px;height:16px;transform:rotate(180deg)}
.fx-head:hover .fx-collapse{background:#f1f5f9;color:var(--ink)}
.fx-hint{font-size:9.5px;line-height:1.4;color:var(--muted);margin:0 4px 8px}
.fx-hint b{color:var(--ink);font-weight:700}
/* collapsed: show only the compact header pill — keeps the map clear (esp. on mobile) */
.fx-deck.collapsed{width:auto}
.fx-deck.collapsed .fx-eyebrow,.fx-deck.collapsed .fx-seg,
.fx-deck.collapsed .fx-chips,.fx-deck.collapsed .fx-hint,
.fx-deck.collapsed .fx-find,.fx-deck.collapsed .fx-hits{display:none}
.fx-deck.collapsed .fx-head{padding:0}
.fx-deck.collapsed .fx-collapse svg{transform:rotate(0)}
@media (max-width:400px){.fx-deck{width:212px}}
.fx-eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--muted);margin:4px 4px 4px}
.fx-seg{display:flex;flex-wrap:wrap;gap:4px;background:#f5f7fa;padding:4px;border-radius:11px}
.fx-base{flex:1 1 auto;border:none;background:transparent;color:var(--muted);
  font:600 11px/1 inherit;padding:6px 7px;border-radius:8px;cursor:pointer;transition:.16s;white-space:nowrap}
.fx-base:hover{color:var(--ink)}
.fx-base.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(15,23,42,.16)}
.fx-chips{display:flex;flex-direction:column;gap:4px}
.fx-chip{
  --c:#888;position:relative;display:flex;align-items:center;gap:9px;width:100%;
  border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:7px 9px;cursor:pointer;
  color:var(--ink);font:600 12.5px/1 inherit;text-align:left;overflow:hidden;
  transition:transform .12s cubic-bezier(.34,1.56,.64,1),border-color .18s,box-shadow .18s;
}
.fx-chip:hover{border-color:#dfe5ec;box-shadow:0 2px 10px -4px rgba(15,23,42,.22)}
.fx-chip:active{transform:scale(.97)}
.fx-chip:before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--c);
  opacity:0;transform:scaleX(0);transform-origin:left;
  transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .32s;z-index:0}
.fx-chip.on:before{opacity:.10;transform:scaleX(1)}
.fx-puck{position:relative;z-index:1;flex:0 0 auto;display:grid;place-items:center;
  width:28px;height:28px;border-radius:9px;color:#fff;background:var(--c);transition:.2s}
.fx-puck svg{width:17px;height:17px}
.fx-chip:not(.on) .fx-puck{background:#eef1f5;color:var(--c)}
.fx-chip.on .fx-puck{box-shadow:0 3px 10px -2px var(--c)}
.fx-name{position:relative;z-index:1;flex:1 1 auto}
.fx-name small{font-weight:600;color:var(--muted);font-size:9.5px;margin-left:3px;
  background:#f1f5f9;padding:1px 4px;border-radius:5px;vertical-align:middle}
.fx-bar{position:relative;z-index:1;width:18px;height:4px;border-radius:3px;background:var(--c);opacity:.28;transition:.2s}
.fx-chip.on .fx-bar{display:none}
.fx-tick{position:relative;z-index:1;width:0;color:var(--c);opacity:0;transform:scale(.4);transition:.2s;overflow:hidden}
.fx-tick svg{width:15px;height:15px}
.fx-chip.on .fx-tick{width:15px;opacity:1;transform:scale(1)}
@keyframes fx-pulse{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 0 8px transparent}}
.fx-chip.pulse .fx-puck{animation:fx-pulse .44s ease-out}
.fx-group{border:1.5px solid var(--line);border-radius:13px;overflow:hidden;transition:border-color .18s}
.fx-group.open{border-color:#dfe5ec}
.fx-group .fx-chip.parent{border:none;border-radius:0;background:transparent}
.fx-group .fx-chip.parent:hover{box-shadow:none;background:#fafbfc}
/* parent row tints when the group is on (full) or partial, so enabled groups read clearly */
.fx-group .fx-chip.parent:before{display:block}
.fx-group .fx-chip.parent.partial:before{opacity:.06;transform:scaleX(1)}
/* the chevron is a distinct, self-contained button (persistent fill) so it reads
   as "expand", separate from tapping the row to toggle the group on/off */
.fx-disc{position:relative;z-index:2;flex:0 0 auto;display:grid;place-items:center;
  width:26px;height:26px;border-radius:8px;color:var(--muted);background:#eef1f6;
  transition:.2s;cursor:pointer;margin-left:2px}
.fx-disc:hover{background:#dde3ec;color:var(--ink)}
.fx-disc svg{width:15px;height:15px;transition:transform .26s cubic-bezier(.4,0,.2,1)}
.fx-group.open .fx-disc svg{transform:rotate(180deg)}
.fx-chip.parent .fx-puck{background:#eef1f5;color:var(--c)}
.fx-chip.parent.partial .fx-puck{background:var(--c);color:#fff;opacity:.55}
.fx-chip.parent.on .fx-puck{background:var(--c);color:#fff;opacity:1;box-shadow:0 3px 10px -2px var(--c)}
.fx-subs{height:0;overflow:hidden;box-sizing:border-box;transition:height .28s cubic-bezier(.4,0,.2,1);
  padding:0 8px;background:linear-gradient(#fbfcfe,#fff)}
.fx-group.open .fx-subs{padding-bottom:8px}
.fx-subs .fx-chip{margin-top:6px}
.fx-subs .fx-chip:first-child{margin-top:2px}
.fx-deck button:focus{outline:none}
.fx-deck button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* inner LV panel toggles by display (not animated max-height) so the drawer
   always measures the correct height and never clips the capacity controls */
.fx-rag{display:none;flex-direction:column;gap:6px;margin:0 2px}
.fx-rag.is-on{display:flex;margin-top:8px}
.fx-rag-tx{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.fx-rag-tx i{width:9px;height:9px;border-radius:50%;border:1.5px solid;flex:0 0 auto}
.fx-cap{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;
  cursor:pointer;color:var(--ink);font:600 11px/1 inherit;padding:1px 0;text-align:left}
.fx-cap-sw{position:relative;width:26px;height:15px;border-radius:9px;background:#d7dde5;transition:.2s;flex:0 0 auto}
.fx-cap-sw:after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
  background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.fx-cap.on .fx-cap-sw{background:var(--accent)}
.fx-cap.on .fx-cap-sw:after{transform:translateX(11px)}
.fx-rag-legend{display:none;flex-direction:column;gap:5px}
.fx-rag.cap-on .fx-rag-legend{display:flex;margin-top:2px}
.fx-rag-bar{height:6px;border-radius:4px;
  background:linear-gradient(90deg,#2E9E5B 0 33%,#E8A317 33% 66%,#D5392B 66%)}
.fx-rag-rows{display:flex;flex-wrap:wrap;gap:4px 11px;font-size:10px;color:var(--muted)}
.fx-rag-rows span{display:inline-flex;align-items:center;gap:5px}
.fx-rag-rows i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.fx-labtog{margin-top:8px}
/* voltage / pressure key: one row per band, a line swatch drawn at the real
   relative weight so the legend teaches the map's own visual grammar */
.fx-key{display:flex;flex-direction:column;gap:3px;margin:8px 2px 0}
.fx-key-row{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted)}
.fx-key-sw{flex:0 0 20px;height:0;border-radius:2px;border-top-style:solid}
.fx-key-row b{color:var(--ink);font-weight:700;font-size:10px}

/* ---- search --------------------------------------------------------------- */
.fx-find{position:relative;margin:0 0 8px}
.fx-find input{box-sizing:border-box;width:100%;border:1.5px solid var(--line);border-radius:11px;
  background:var(--sunk);color:var(--ink);font:600 12px/1 inherit;padding:9px 9px 9px 28px;
  transition:border-color .18s,background .18s}
.fx-find input::placeholder{color:#94a3b8;font-weight:500}
.fx-find input:focus{outline:none;border-color:var(--accent);background:#fff}
.fx-find svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;
  color:#94a3b8;pointer-events:none}
.fx-hits{display:none;flex-direction:column;gap:2px;margin:5px 0 0;max-height:212px;overflow-y:auto}
.fx-hits.on{display:flex}
.fx-hit{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;
  border-radius:9px;padding:6px 7px;cursor:pointer;text-align:left;color:var(--ink);font:600 11.5px/1.25 inherit}
.fx-hit:hover,.fx-hit.sel{background:var(--sunk)}
.fx-hit i{flex:0 0 8px;height:8px;border-radius:50%;background:var(--c,#888)}
.fx-hit span{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-hit small{color:var(--muted);font-weight:600;font-size:9.5px;white-space:nowrap}
.fx-none{font-size:10.5px;color:var(--muted);padding:5px 7px}

/* ---- brand card (top-left) ------------------------------------------------ */
.brand{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-radius:14px;
  box-shadow:var(--shadow-sm);padding:8px 13px 9px;font:var(--font);
  animation:fx-in .34s cubic-bezier(.16,1,.3,1) both}
.brand h1{margin:0;font:800 14px/1.15 var(--font);letter-spacing:-.2px;color:var(--ink)}
.brand p{margin:3px 0 0;font:600 9.5px/1.3 var(--font);color:var(--muted);display:flex;
  align-items:center;gap:6px;white-space:nowrap}
.brand p i{display:inline-block;width:15px;height:0;border-top:2px solid #94a3b8;vertical-align:middle}
.brand p i.d{border-top-style:dashed}
@media (max-width:560px){.brand h1{font-size:12.5px}.brand p{display:none}}

/* ---- zoom hint (bottom-left) --------------------------------------------- */
.lvhint{background:rgba(15,23,42,.9);backdrop-filter:blur(8px);color:#fff;
  font:600 11.5px/1.3 var(--font);padding:7px 12px;border-radius:10px;
  box-shadow:0 4px 16px -4px rgba(15,23,42,.5);margin:0 0 10px 10px;
  animation:fx-in .28s cubic-bezier(.16,1,.3,1) both}

/* ---- map labels ----------------------------------------------------------
   Permanent tooltips, no bubble chrome: a halo reads far better over mapping
   than a box, and boxes at this density become the map. Two lines - name over
   a quiet detail line (kV / MW / operator) - because "Name 348 MW" on one
   line makes a long ribbon that collides with everything.
   ------------------------------------------------------------------------- */
.mlab{background:transparent;border:none;box-shadow:none;padding:0;margin:0;
  white-space:nowrap;pointer-events:none;text-align:center;
  font:700 10.5px/1.15 var(--font);color:#1c2733;
  text-shadow:0 0 2px var(--halo),0 0 3px var(--halo),0 0 4px var(--halo),0 0 6px var(--halo)}
.mlab:before{display:none}                       /* kill Leaflet's tooltip arrow */
/* NB: no opacity/animation of our own here. Leaflet fades tooltips in and out
   through .leaflet-fade-anim, and it removes a dropped tooltip's element 200ms
   AFTER setting opacity:0. A local `animation:... forwards` outranks that inline
   opacity, so every dropped label stayed fully painted for 200ms and the map
   flickered a double set of names on each rebuild. */
.mlab em{display:block;font-style:normal;font-weight:600;font-size:9.5px;opacity:.82;letter-spacing:.1px}
.mlab.l{font-weight:600;font-size:9.5px;opacity:.95}    /* line / cable labels: quieter */
.mlab.big{font-size:12px;letter-spacing:-.1px}          /* transmission + power stations */
.dark .mlab{color:#eaf0f7}
.dark .mlab em{opacity:.72}

/* Site labels (gas AGI etc). Hidden until the map carries .showlbl (zoom 17+). */
.leaflet-tooltip.sitelbl{display:none;background:none;border:none;box-shadow:none;padding:0;
  font:700 10.5px/1.2 var(--font);color:#7A3B00;white-space:nowrap;pointer-events:none;
  text-shadow:0 0 2px var(--halo),0 0 3px var(--halo),0 0 4px var(--halo),0 0 6px var(--halo)}
.leaflet-tooltip.sitelbl::before{display:none}
.showlbl .leaflet-tooltip.sitelbl{display:block}
.dark .leaflet-tooltip.sitelbl{color:#f0b877}

/* ---- hover readout ------------------------------------------------------- */
.hovtip{background:rgba(15,23,42,.92);backdrop-filter:blur(6px);border:none;box-shadow:0 4px 14px -4px rgba(15,23,42,.55);
  border-radius:8px;padding:5px 9px;color:#fff;font:600 11px/1.35 var(--font);white-space:nowrap;pointer-events:none}
.hovtip:before{display:none}
.hovtip b{font-weight:700}
.hovtip u{display:block;text-decoration:none;font-weight:600;font-size:9.5px;opacity:.7;margin-top:1px}

/* ---- power-station glyph markers ----------------------------------------- */
.psym{background:none;border:none}
.psym i{display:grid;place-items:center;box-sizing:border-box;width:100%;height:100%;
  border-radius:8px;background:#fff;border:2px solid var(--c,#C4322A);
  box-shadow:0 2px 7px -2px rgba(15,23,42,.45);transition:transform .16s cubic-bezier(.34,1.56,.64,1)}
.psym:hover i{transform:scale(1.14)}
.psym svg{width:64%;height:64%;color:var(--c,#C4322A)}
.dark .psym i{background:#151b23}

/* ---- popups: same card language as the deck ------------------------------ */
.leaflet-popup-content-wrapper{border-radius:14px!important;box-shadow:var(--shadow)!important;
  padding:0!important;overflow:hidden}
.leaflet-popup-content{font:12px/1.45 var(--font);margin:0!important;width:262px!important;
  max-height:none;scrollbar-gutter:stable}
.leaflet-popup-tip{box-shadow:none}
.leaflet-popup-close-button{width:26px!important;height:26px!important;top:5px!important;right:4px!important;
  color:var(--muted)!important;font:300 19px/26px var(--font)!important;border-radius:8px}
.leaflet-popup-close-button:hover{background:var(--sunk);color:var(--ink)!important}
.pop{padding:11px 13px 12px}
.pop-hd{display:flex;align-items:center;gap:8px;padding-right:22px}
.pop-hd i{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:var(--c,#888);color:#fff}
.pop-hd i svg{width:15px;height:15px}
.pt{font-weight:800;font-size:12.5px;letter-spacing:-.1px;text-transform:capitalize;color:var(--ink);line-height:1.2}
.pn{color:var(--ink);font-weight:700;font-size:13.5px;letter-spacing:-.2px;margin:9px 0 0;line-height:1.25}
.pm{color:var(--muted);font-size:10px;font-weight:600;margin:1px 0 0;line-height:1.35}
.pop-tags{max-height:158px;overflow:auto;margin-top:9px;scrollbar-width:thin;scrollbar-color:#cbd2dc transparent}
.leaflet-popup-content table{border-collapse:collapse;margin:9px 0 0;width:100%}
.leaflet-popup-content td{border-top:1px solid var(--line);padding:3px 8px 3px 0;vertical-align:top;
  font-size:11px;color:var(--ink)}
.leaflet-popup-content tr:first-child td{border-top:none}
.k{color:var(--muted);font-weight:600;white-space:nowrap;width:36%}
.pop a.osm{display:inline-block;margin-top:9px;font-size:10px;font-weight:600;color:var(--muted);
  text-decoration:none;font-variant-numeric:tabular-nums}
.pop a.osm:hover{color:var(--accent);text-decoration:underline}
.gm{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.gm a{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:5px;
  background:var(--sunk);border-radius:9px;padding:7px 4px;color:var(--ink);font-weight:700;
  text-decoration:none;font-size:10.5px;transition:background .16s,color .16s}
.gm a:hover{background:var(--accent);color:#fff}
.gm svg{width:12px;height:12px}
/* the old .tt class stays a valid popup class name - it now just means "card" */
.tt .leaflet-popup-content-wrapper{border-radius:14px}

/* ---- loading splash ------------------------------------------------------- */
#boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
  background:#f8fafc;font:var(--font);color:var(--ink)}
.boot-in{display:flex;flex-direction:column;align-items:center;gap:13px;text-align:center}
.boot-ring{width:30px;height:30px;border-radius:50%;border:3px solid #e2e8f0;
  border-top-color:var(--accent);animation:boot-spin .8s linear infinite}
@keyframes boot-spin{to{transform:rotate(360deg)}}
.boot-in b{font:800 14px/1.2 var(--font);letter-spacing:-.2px}
.boot-in span{font:600 11px/1.3 var(--font);color:var(--muted)}
</style>
</head><body><div id="map"></div>
<div id="boot"><div class="boot-in"><div class="boot-ring"></div>
  <b>Merseyside Infrastructure</b>
  <span>Loading the network&hellip;</span></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CAT={
  power :{c:'#6A2FBF',label:'Power'},
  train :{c:'#2B2F36',label:'Trains'},
  water :{c:'#1C8FB0',label:'Water'},
  sewage:{c:'#8A6A45',label:'Sewage'},
  gas   :{c:'#E8730C',label:'Gas'},
  fuel  :{c:'#C026A8',label:'Oil &amp; chemicals'},
};

  return card({
    color:p.cat==='power'?(isDC(p)?KV[0].c:kvBand(kvOf(p)).c):b.c,
    icon:catIcon(p.cat,p.kind), kicker:p.kind||b.label, name:p.name||'',
    meta:[b.label,kv||null,p.ug?'underground':null,t.operator||null].filter(Boolean).join(' &middot; '),
    rows:rowsOf(Object.entries(t).filter(([k])=>!skip[k])),
    osm:p.osm, osmLabel:p.id, lat, lon });
}

// ---- shared hover readout ---------------------------------------------------
// One tooltip reused by every layer, rather than a bound tooltip per feature:
// binding to 7.6k features would build 7.6k tooltip objects for the one that is
// under the cursor. Hovering also thickens the stroke, so it is obvious which
// of several overlapping runs a click would hit.
const hoverTip=L.tooltip({className:'hovtip',direction:'top',offset:[0,-8],opacity:1,interactive:false});
let hoverLayer=null;
// An unnamed feature is most of the map, and "line" on its own says nothing, so
// the kind is qualified with whatever the record does know: "132 kV line",
// "underground cable". Named features lead with the name and demote the rest.
function hoverText(cat,p){
  const kv=kvText(p.voltage), kind=p.kind||(CAT[cat]||{}).label||'feature';
  const mw=(p.tags||{})['plant:output:electricity'];
  if(!p.name){
    const head=[kv,p.ug?'underground':null,kind].filter(Boolean).join(' ');
    return `<b>${head}</b>`+(mw?`<u>${mw}</u>`:'');
  }
  const bits=[kv,p.ug?'underground':null,mw,(p.tags||{}).ref].filter(Boolean);
  return `<b>${p.name}</b>`+(bits.length?`<u>${bits.join(' &middot; ')}</u>`:'');
}
// `base` is the layer's OWN style function, needed because mouseout has to put
// back exactly the stroke it replaced. Falling back to the category default here
// would repaint the transmission spine as a generic orange gas pipe the first
// time the cursor crossed it.
function bindHover(cat,f,l,base){
  const styleOf = base || (ff=>styleFor(cat,ff));
  l.on('mouseover',e=>{
    hoverLayer=l;
    // no bringToFront: on a canvas renderer that reorders the whole draw chain
    // and forces a full repaint, and the weight bump already says which run the
    // cursor is on
    try{ l.setStyle(hoverStyle(styleOf(f))); }catch(err){}
    hoverTip.setLatLng(e.latlng||(l.getLatLng&&l.getLatLng())||map.getCenter())
            .setContent(hoverText(cat,f.properties||{}));
    if(!map.hasLayer(hoverTip)) hoverTip.addTo(map);
  });
  l.on('mousemove',e=>{ if(hoverLayer===l&&e.latlng&&!(l.getLatLng)) hoverTip.setLatLng(e.latlng); });
  l.on('mouseout',()=>{
    if(hoverLayer!==l) return;
    hoverLayer=null;
    try{ l.setStyle(styleOf(f)); }catch(err){}
    if(map.hasLayer(hoverTip)) map.removeLayer(hoverTip);
  });
}
// The hovered feature keeps its own colour but gains weight and a full-opacity
// stroke; a hidden (zoom-gated) point stays hidden rather than popping into view.
function hoverStyle(s){
  if(s.radius!=null) return s.opacity===0&&s.fillOpacity===0 ? s
    : Object.assign({},s,{radius:s.radius+1.6,weight:2});
  return Object.assign({},s,{weight:(s.weight||1.5)+1.8,opacity:1});
}

// ============================================================================
//  SUB-CATEGORY LAYERS  (built BEFORE the control mounts; never undefined)
//  Replaces the old:
//     const layers={}; ORDER.forEach(k=>{layers[k]=catLayer(k);});
//     ...traction markers onto layers.train...
//     ORDER.forEach(k=>layers[k].addTo(map));
//  and the old extra_infra merge block.
//  Each predicate-backed child is its own canvas L.geoJSON reusing catLayer()'s
//  exact style/pointToLayer/click so visuals + popups are byte-identical.
// ============================================================================

// ---- predicates: pure functions of geometry-type + kind (no re-classify) ----
const geomType = f => (f.geometry && f.geometry.type) || '';
const isLine   = f => /LineString/.test(geomType(f));            // LineString | MultiLineString
const kindOf   = f => (f.properties.kind || '').toLowerCase();
const WATER_PIPE = f => isLine(f) && /pipe|aqueduct|main/.test(kindOf(f)) && !/dam/.test(kindOf(f));

// Per-category ordered child predicates. First match wins; the LAST child in
// each category is the catch-all "else", so every cat feature lands in exactly
// one sub-layer and nothing is ever dropped or duplicated.
const SUBPRED = {
  power : { 'power.ps'  : f => /power station/.test(kindOf(f)),
            'power.hv'  : f => true },                                   // else: substation/line/cable/minor_line
  fuel  : { 'fuel.pipe' : f => isLine(f),
            'fuel.tank' : f => true },                                   // else: tanks(Polygon)+chimneys(Point)
  gas   : { 'gas.pipe'  : f => isLine(f),
            'gas.hold'  : f => true },                                   // else: gas holders
  water : { 'water.pipe': f => WATER_PIPE(f),
            'water.site': f => true },                                   // else: reservoirs/dams/works/towers/pumping/tanks/weirs
  sewage: { 'sewage.pipe': f => isLine(f),
            'sewage.site': f => true },                                  // else: works/pumping/tanks
};
const SUBKEYS = {                                  // ordered child keys per cat
  power:['power.ps','power.hv'], fuel:['fuel.pipe','fuel.tank'],
  gas:['gas.pipe','gas.hold'],  water:['water.pipe','water.site'],
  sewage:['sewage.pipe','sewage.site'],
};
// Resolve which child sub-key a feature of category `cat` belongs to (or null).
function subKeyFor(cat, f){
  const preds = SUBPRED[cat]; if(!preds) return null;     // train -> no group
  for(const key of SUBKEYS[cat]){ if(preds[key](f)) return key; }
  return SUBKEYS[cat][SUBKEYS[cat].length-1];             // safety net (never hit: last is else)
}

// ---- factory: one sub-layer, zoom-graded, hover-aware ------------------------
// Power dispatches to powerStyle (voltage-graded); every other category to its
// single colour. Registered in `graded` so a zoom-band change restyles it.
function subLayer(cat, feats){
  const isPower = cat==='power';
  const lineStyle = isPower ? powerStyle : catStyle(cat);
  const ptStyle   = isPower ? powerStyle : catPointStyle(cat);
  const lyr = L.geoJSON({type:'FeatureCollection',features:feats},{
    style:lineStyle,
    pointToLayer:(f,ll)=>L.circleMarker(ll,ptStyle(f)),
    onEachFeature:(f,l)=>{
      bindHover(cat,f,l, ff=>/Point/.test(ff.geometry&&ff.geometry.type||'')?ptStyle(ff):lineStyle(ff));
      l.on('click',e=>{
        const ll=e.latlng||(l.getLatLng&&l.getLatLng())||map.getCenter();
        L.popup({className:'tt'}).setLatLng(ll).setContent(pop(f.properties,ll.lat,ll.lng)).openOn(map);});
    },
  });
  graded.push({layer:lyr,cat});
  // a layer switched on after a zoom change is still carrying the old band's
  // weights, so bring it up to date as it is added rather than on the next pan
  lyr.on('add',()=>{ try{ lyr.setStyle(isPower?powerStyle:styleFor.bind(null,cat)); }catch(e){} });
  return lyr;
}

// ---- power stations: a real symbol, sized by output --------------------------
// 137 features, so these can afford DOM markers. A wind farm, a battery site
// and a gas CCGT are different objects and the map should say so - this is the
// detail that makes a power map look surveyed rather than plotted.
const PS_SRC=k=>{
  const s=(k||'').toLowerCase();
  for(const key of ['wind','solar','battery','hydro','nuclear','biomass','biogas','coal','waste','gas','oil','diesel'])
    if(s.includes(key)) return key==='biogas'?'biomass':(key==='oil'||key==='diesel'?'gas':key);
  return 'other';
};
const MW=p=>{const m=/([\d.]+)\s*([MGk])W/i.exec(((p.tags||{})['plant:output:electricity'])||'');
  if(!m) return 0; const n=parseFloat(m[1]); return m[2]==='G'?n*1000:m[2]==='k'?n/1000:n;};
// 20px for a small site up to 32px for a GW-scale station, then scaled down at
// wide zooms so a region view is not a field of badges.
function psSize(mw){
  const base = mw>=800?31 : mw>=300?27 : mw>=50?23 : mw>=5?20 : 17;
  return Math.round(base*Math.max(.66,Math.min(1,zMul)));
}
function psIcon(f){
  const p=f.properties||{}, src=PS_SRC(p.kind||(p.tags||{})['plant:source']), s=psSize(MW(p));
  return L.divIcon({className:'psym',iconSize:[s,s],iconAnchor:[s/2,s/2],
    html:`<i style="--c:${KV[1].c}">${PS_ICON[src]||PS_ICON.other}</i>`});
}
const psPolyStyle=f=>({color:KV[1].c,weight:W(1),opacity:.75,fillColor:KV[1].c,
  fillOpacity:Math.round(map.getZoom())>=13?.14:.26,lineJoin:'round'});
function psLayer(feats){
  // the plant footprint stays, drawn faintly, with the badge at its centre: the
  // badge is what you find at a wide zoom, the outline is the extent up close
  const lyr=L.geoJSON({type:'FeatureCollection',features:feats},{
    style:psPolyStyle,
    pointToLayer:(f,ll)=>f.properties&&f.properties._ps
      ? L.marker(ll,{icon:psIcon(f),keyboard:false,riseOnHover:true})
      : L.circleMarker(ll,{radius:Math.max(3,5*Math.min(1.2,zMul)),color:'#fff',weight:1.5,
                           fillColor:KV[1].c,fillOpacity:1}),
    onEachFeature:(f,l)=>{
      if(!(f.properties||{})._ps) bindHover('power',f,l,psPolyStyle);
      l.on('click',e=>{
        const ll=e.latlng||(l.getLatLng&&l.getLatLng())||map.getCenter();
        L.popup({className:'tt'}).setLatLng(ll).setContent(pop(f.properties,ll.lat,ll.lng)).openOn(map);});
    },
  });
  // badges are DOM, not canvas, so they need their own resize pass per band
  gradedHooks.push(()=>{
    if(!map.hasLayer(lyr)) return;
    lyr.eachLayer(l=>{ if(l.feature&&(l.feature.properties||{})._ps&&l.setIcon) l.setIcon(psIcon(l.feature)); });
    try{ lyr.setStyle(psPolyStyle); }catch(e){}
  });
  return lyr;
}

// (layer build + extra_infra merge now live in initData(), below — they run after data.json resolves)

// ---- LV (low-voltage) network ------------------------------------------------
// SP Energy Networks "ConnectMore" data, kept local. Two parts (like every layer,
// off until switched on):
//   cables       ~310k merged polylines (from ~1.47M source segments), served as
//                full-precision GeoJSON tiles (tiles/lvgeo/{x}/{y}.json, z14 grid).
//                A viewport-windowed L.geoJSON canvas layer draws only the cables
//                in view, so they are REAL vectors - crisp at every zoom, exactly
//                like the other layers. Shown from zoom 16.
//   transformers 27.6k points from lv_transformers.geojson, fixed-size clickable
//                markers; only the in-view ones exist. Shown from zoom 14.
// Cables are coloured by network capacity headroom (RAG).
const RAGC={r:'#D5392B',a:'#E8A317',g:'#2E9E5B',x:'#9AA0A6'};
const RAGT={r:'at / near capacity',a:'limited spare capacity',g:'spare capacity',x:'not assessed'};

// web-mercator tile maths for the z14 GeoJSON cable grid
const lvLon2x=(lon,z)=>Math.floor((lon+180)/360*Math.pow(2,z));
const lvLat2y=(lat,z)=>{const r=lat*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z));};
const LV_GRID=14, LV_MINZOOM=16, LV_MAXCACHE=80;
const LV_PLAIN='#22B8D9';                  // default: cables in one colour
let lvByCapacity=true;                      // toggle: colour cables by RAG capacity (default on)
function lvCableStyle(f){return{color:lvByCapacity?(RAGC[f.properties.rag]||RAGC.x):LV_PLAIN,
  weight:W(1.35),opacity:.9,lineCap:'round'};}
function setLvCapacity(on){lvByCapacity=on; if(lvCableLayer)lvCableLayer.setStyle(lvCableStyle);}
gradedHooks.push(()=>{ if(lvCableLayer) try{ lvCableLayer.setStyle(lvCableStyle); }catch(e){} });
const lvTileCache=new Map();
let lvCableLayer=null, lvRenderToken=0, lvLastSig='';
function lvCablePopup(e,p){
  L.popup({className:'tt'}).setLatLng(e.latlng).setContent(card({
    color:lvByCapacity?(RAGC[p.rag]||RAGC.x):LV_PLAIN, icon:ICON.lv,
    kicker:'LV cable', meta:'SP Manweb low-voltage network',
    rows:rowsOf([['cable',p.type],['voltage',(p.v||230)+' V'],['capacity',RAGT[p.rag]||RAGT.x]]),
    lat:e.latlng.lat, lon:e.latlng.lng})).openOn(map);
}
async function lvFetchTile(x,y){
  const k=x+'/'+y;
  if(lvTileCache.has(k)){const v=lvTileCache.get(k);lvTileCache.delete(k);lvTileCache.set(k,v);return v;}
  let fc={features:[]};
  try{const r=await fetch('tiles/lvgeo/'+x+'/'+y+'.json');if(r.ok)fc=await r.json();}catch(e){}
  lvTileCache.set(k,fc);
  while(lvTileCache.size>LV_MAXCACHE)lvTileCache.delete(lvTileCache.keys().next().value);
  return fc;
}
async function renderLvCables(){
  if(!map.hasLayer(lvNetwork)||map.getZoom()<LV_MINZOOM){ if(lvCableLayer)lvCableLayer.clearLayers(); return; }
  const token=++lvRenderToken;
  const b=map.getBounds().pad(0.2), z=LV_GRID;
  const x0=lvLon2x(b.getWest(),z),x1=lvLon2x(b.getEast(),z),y0=lvLat2y(b.getNorth(),z),y1=lvLat2y(b.getSouth(),z);
  // the rendered set is fully determined by the z14 tile window; identical window => nothing to redraw.
  // (do NOT add per-feature viewport filtering below without folding it into sig)
  const sig=x0+':'+x1+':'+y0+':'+y1;
  if(sig===lvLastSig && lvCableLayer && lvCableLayer.getLayers().length) return;
  lvLastSig=sig;
  const reqs=[]; for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)reqs.push(lvFetchTile(x,y));
  const fcs=await Promise.all(reqs);
  if(token!==lvRenderToken) return;            // a newer render superseded this one
  const seen=new Set(), feats=[];
  for(const fc of fcs)for(const f of (fc.features||[])){ if(seen.has(f.id))continue; seen.add(f.id); feats.push(f); }
  if(!lvCableLayer){
    // shared (map default) canvas renderer so clicks hit-test across all layers
    lvCableLayer=L.geoJSON(null,{
      style:lvCableStyle,
      onEachFeature:(f,l)=>l.on('click',e=>lvCablePopup(e,f.properties))});
    lvNetwork.addLayer(lvCableLayer);
  }
  lvCableLayer.clearLayers();
  lvCableLayer.addData({type:'FeatureCollection',features:feats});
}

// Transformers: fixed-size, always-clickable markers. Only the in-view ones exist.
const lvTx=L.layerGroup();
let lvTxData=null, lvTxLoading=false;
function txPopup(p,lat,lon){return card({
  color:'#D9A400', icon:ICON.sub, kicker:'LV transformer',
  meta:'distribution substation &middot; '+(RAGT[p.rag]||RAGT.x),
  rows:rowsOf([['ref',p.id]]), lat, lon});}
let lvTxKey=null;   // last-rendered z14 tile window; skip full rebuild when unchanged
function renderLvTx(){
  if(!lvTxData||!map.hasLayer(lvNetwork)||map.getZoom()<14){ if(lvTx.getLayers().length) lvTx.clearLayers(); lvTxKey=null; return; }
  const b=map.getBounds().pad(0.25), z=LV_GRID;
  const x0=lvLon2x(b.getWest(),z),x1=lvLon2x(b.getEast(),z),y0=lvLat2y(b.getNorth(),z),y1=lvLat2y(b.getSouth(),z);
  const key=x0+':'+x1+':'+y0+':'+y1;
  if(key===lvTxKey && lvTx.getLayers().length) return;   // same window already drawn
  lvTxKey=key; lvTx.clearLayers();
  for(const f of lvTxData.features){
    const c=f.geometry.coordinates;            // [lng,lat]
    if(!b.contains([c[1],c[0]])) continue;
    L.circleMarker([c[1],c[0]],{radius:5,color:'#3A2E00',weight:1.5,fillColor:'#FFC400',fillOpacity:1})
      .bindPopup(txPopup(f.properties||{},c[1],c[0]),{className:'tt'}).addTo(lvTx);
  }
}
function syncLvTx(){
  if(!map.hasLayer(lvNetwork)||map.getZoom()<14){ lvTx.clearLayers(); return; }
  if(lvTxData){ renderLvTx(); return; }
  if(lvTxLoading) return; lvTxLoading=true;
  fetch('lv_transformers.geojson').then(r=>r.json()).then(fc=>{lvTxData=fc;lvTxLoading=false;renderLvTx();}).catch(()=>{lvTxLoading=false;});
}
function syncLv(){ syncLvTx(); renderLvCables(); updateLvHint(); }
const lvNetwork=L.layerGroup([lvTx]);   // cables added lazily into it by renderLvCables
lvNetwork.on('add',syncLv);
lvNetwork.on('remove',()=>{ lvTx.clearLayers(); lvTxKey=null; if(lvCableLayer)lvCableLayer.clearLayers(); updateLvHint(); });
// ---- Cadent gas distribution network -----------------------------------------
// Cadent "Gas Pipe Infrastructure - GPI Open" (Open Government Licence v3.0),
// kept local as z14 GeoJSON tiles exactly like the LV cables. Two viewport-
// windowed layers, each drawn as real canvas vectors so they stay crisp:
//   mains     tiles/gasgeo/main - the distribution grid,          from zoom 14
//   services  tiles/gasgeo/svc  - last-mile pipes into premises,  from zoom 17
// Separate tile trees, so a z14 view never downloads the service geometry it
// would not draw until z17, and either layer can be gated independently.
// GPI Open covers the low/medium-pressure network only. Cadent's higher-pressure
// (IP/HP) network is a "Shared" dataset needing a data sharing agreement, so it
// is deliberately not fetched here. The styling below still handles IP and HP,
// because the local-only overlay (see local/README.md) can supply them from a
// source you are separately entitled to use, and they must not fall through to
// the LP colour when it does.
// Unlike the OSM layers these are drawn solid rather than dashed even though the
// network is almost entirely buried - the same call the LV cables make, because
// a whole dense street-level layer in dashes is unreadable. Each popup says
// which side of the ground the pipe is on.
// The value dictionaries are Cadent's own, from the dataset's data catalogue.
// The zoom a layer starts drawing at, so the hint can say which switched-on
// layer is still waiting rather than leaving it looking broken. Keyed by the
// layer object; a layer that is absent here draws at any zoom.
const layerMinZoom=new Map();
// Lowest zoom at which ANY part of a (possibly nested) toggle draws. A group is
// only worth hinting about when nothing inside it can draw yet - the High
// pressure toggle also carries the OSM transmission ways, which draw at every
// zoom, so it must never be reported as waiting.
function effMinZoom(l){
  if(!l) return 0;
  if(layerMinZoom.has(l)) return layerMinZoom.get(l);
  if(l.getLayers){
    const kids=l.getLayers();
    if(kids.length) return Math.min.apply(null,kids.map(effMinZoom));
  }
  return 0;
}
const GAS_PRESS={LP:'Low pressure (&le;75 mbarg)',MP:'Medium pressure (&gt;75 mbarg, &le;2 barg)',
                 IP:'Intermediate pressure (&gt;2, &le;7 barg)',HP:'High pressure (&gt;7 barg)',
                 HPL:'Local high pressure (&gt;7 barg)',HPN:'National high pressure (&gt;7 barg)'};
const GAS_MAT={CI:'Cast iron',DI:'Ductile iron',PE:'Polyethylene',SI:'Spun iron',ST:'Steel',
               AS:'Asbestos',CO:'Copper',LE:'Lead',PV:'PVC',FP:'Flexible polyethylene',
               GL:'Galvanised',UN:'Unknown'};
const GAS_TYPE={m:'Gas main',s:'Gas service pipe',r:'Gas riser',
                n:'NTS transmission pipe',l:'LTS transmission pipe',u:'Gas pipe'};
const GAS_DU={MM:'mm',I:'in',UN:''};
const GAS_GRID=14, GAS_MAXCACHE=80;
// Services were gated at z17 with nothing to say so: switch them on any wider
// out and the layer silently drew nothing, which reads as broken rather than as
// zoomed out. z16 matches the LV cables, and hintText() now names them.
const GAS_MAIN_MINZOOM=14, GAS_SVC_MINZOOM=16;
// Colour encodes PRESSURE TIER, weight encodes pipe type. The "Colour pipes by
// pressure" toggle in the Gas drawer mirrors the LV capacity control: on by
// default; switched off, pipes fall back to one colour per type so mains and
// services can still be told apart. Both mains and services carry a real LP/MP
// split (in this region 150k/7.4k mains, 10.9k/2.1k services), so the toggle is
// worth having on both rather than mains alone.
// One canonical pressure scale, darker and heavier as pressure rises. These
// hexes are shared with build_gas_local.mjs (TIERS) and MUST stay in step with
// it: a local overlay's HP/IP layers and this layer's pipes are drawn on the
// same map, so a colour that means two different tiers is worse than no colour
// at all. Previously #9A3412 meant MP here and IP there.
// HPN/HPL split the old single HP tier: a MAPS Viewer extract distinguishes the
// National (NTS/LTS transmission) high-pressure network from the Local one, and
// those are very different things to have under a street. HP stays for sources
// that only say "high pressure" - it keeps its historic hex so nothing already
// exported silently changes meaning.
const GAS_COL={HPN:'#3B0D0D',HPL:'#7A2222',HP:'#5A1A1A',IP:'#9A3412',MP:'#B4530A',LP:'#E8730C',UN:'#9AA0A6'};
// Line weight also carries tier, so the scale survives greyscale printing and
// stays legible for anyone who cannot separate the reds.
const GAS_WT={HPN:3.8,HPL:3.4,HP:3.4,IP:3,MP:2.6,LP:1.8,UN:1.6};
const GAS_PLAIN='#E8730C';                      // mains, pressure colouring off
const GAS_SVC_COL='#F2B279';                    // service pipes / risers, pressure colouring off
const isGasSvc=p=>p.t==='s'||p.t==='r';
let gasByPressure=true;                         // toggle state (default on)
const gasRestyle=[];                            // per-layer restyle hooks
function gasStyle(f){const p=f.properties, svc=isGasSvc(p);
  const col = gasByPressure ? (GAS_COL[p.p]||GAS_PLAIN) : (svc?GAS_SVC_COL:GAS_PLAIN);
  return{color:col, weight: W(svc?.85:(GAS_WT[p.p]||1.8)), opacity: svc?.85:.92,
         lineCap:'round', lineJoin:'round'};}
function setGasPressure(on){ gasByPressure=on; for(const r of gasRestyle) r(); }
// pipes are zoom-graded like every other line, so the same restyle hook the
// pressure toggle uses is fired on a zoom-band change
gradedHooks.push(()=>{ for(const r of gasRestyle) r(); });
function gasPopup(e,p){
  const u=GAS_DU[p.du]!==undefined?GAS_DU[p.du]:'';
  const dia=(p.d!=null&&p.d>0)?(p.d+(u?'&nbsp;'+u:'')):'-';
  L.popup({className:'tt'}).setLatLng(e.latlng).setContent(card({
    color:GAS_COL[p.p]||GAS_PLAIN, icon:ICON.pipe,
    kicker:GAS_TYPE[p.t]||GAS_TYPE.u, meta:'Cadent gas distribution network',
    rows:rowsOf([['pressure',GAS_PRESS[p.p]||p.p],
                 ['material',GAS_MAT[p.m]||p.m],
                 ['diameter',dia==='-'?null:dia],
                 ['installed',p.yr],
                 ['position',p.ag?'above ground':'below ground']]),
    lat:e.latlng.lat, lon:e.latlng.lng})).openOn(map);
}
// One viewport-windowed tile layer per tree; identical machinery to the LV cables.
const gasRenders=[];
// Where the MAPS extract has data it is the better source - surveyed, with real
// diameter/material and a full pressure split - so the open-data mains are
// clipped OUT of its envelope rather than drawn underneath it. That keeps a
// single "Mains" toggle honest: authoritative geometry inside, wider open-data
// coverage (Cheshire, Warrington, north Wales) outside, and never both for the
// same pipe. A main may cross the edge several times, so clipping is done per
// segment rather than by testing one arbitrary point on the whole feature.
// mapsBounds is filled in from tiles/mapsgeo/meta.json; until it loads, or with
// no MAPS extract at all, nothing is suppressed.
let mapsBounds=null;
const sameCoord=(a,b)=>a&&b&&Math.abs(a[0]-b[0])<1e-10&&Math.abs(a[1]-b[1])<1e-10;
const lerpCoord=(a,b,t)=>a.map((v,i)=>typeof b[i]==='number'?v+(b[i]-v)*t:v);
function outsideLine(line){
  const [xmin,ymin,xmax,ymax]=mapsBounds, parts=[]; let cur=null;
  const flush=()=>{ if(cur&&cur.length>1)parts.push(cur); cur=null; };
  const add=(a,b)=>{
    if(!cur) cur=[a,b];
    else if(sameCoord(cur[cur.length-1],a)){ if(!sameCoord(cur[cur.length-1],b))cur.push(b); }
    else { flush(); cur=[a,b]; }
  };
  for(let i=1;i<line.length;i++){
    const a=line[i-1], b=line[i], dx=b[0]-a[0], dy=b[1]-a[1], ts=[0,1];
    const cut=t=>{ if(t>1e-10&&t<1-1e-10)ts.push(t); };
    if(dx){ cut((xmin-a[0])/dx); cut((xmax-a[0])/dx); }
    if(dy){ cut((ymin-a[1])/dy); cut((ymax-a[1])/dy); }
    ts.sort((x,y)=>x-y);
    const cuts=ts.filter((t,i)=>!i||Math.abs(t-ts[i-1])>1e-10);
    for(let j=1;j<cuts.length;j++){
      const t0=cuts[j-1],t1=cuts[j],tm=(t0+t1)/2;
      const m=lerpCoord(a,b,tm), p0=lerpCoord(a,b,t0), p1=lerpCoord(a,b,t1);
      const outside=m[0]<xmin||m[0]>xmax||m[1]<ymin||m[1]>ymax;
      if(outside) add(p0,p1); else flush();
    }
  }
  flush(); return parts;
}
function clipOutsideMaps(f){
  if(!mapsBounds) return [f];
  const g=f.geometry||{}, lines=g.type==='LineString'?[g.coordinates]
    :g.type==='MultiLineString'?g.coordinates:null;
  if(!lines) return [f];
  const parts=lines.flatMap(outsideLine);
  if(lines.length===1&&parts.length===1&&parts[0].length===lines[0].length
      &&parts[0].every((p,i)=>sameCoord(p,lines[0][i]))) return [f];
  const base=f.id!=null?String(f.id):String((f.properties||{}).id||'main');
  return parts.map((coordinates,i)=>({...f,id:base+':outside:'+i,
    geometry:{type:'LineString',coordinates}}));
}
// `select` may return a replacement feature array (used by the boundary clip),
// true/false as a filter, or be omitted. The open-data mains are split across
// four pressure toggles over the same tiles, hence the shared URL-keyed cache.
function gasTileLayer(dir,minzoom,select){
  const group=L.layerGroup();
  layerMinZoom.set(group,minzoom);
  let layer=null, token=0;
  const tile=(x,y)=>fetchTileJSON('tiles/gasgeo/'+dir+'/'+x+'/'+y+'.json');
  async function render(){
    if(!map.hasLayer(group)||map.getZoom()<minzoom){ if(layer)layer.clearLayers(); return; }
    const t=++token;
    const b=map.getBounds().pad(0.2), z=GAS_GRID;
    const x0=lvLon2x(b.getWest(),z),x1=lvLon2x(b.getEast(),z),
          y0=lvLat2y(b.getNorth(),z),y1=lvLat2y(b.getSouth(),z);
    const reqs=[]; for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)reqs.push(tile(x,y));
    const fcs=await Promise.all(reqs);
    if(t!==token) return;                        // a newer render superseded this one
    const seen=new Set(), feats=[];
    for(const fc of fcs)for(const f of (fc.features||[])){ if(seen.has(f.id))continue; seen.add(f.id);
      const picked=select?select(f):[f];
      if(Array.isArray(picked))feats.push(...picked); else if(picked)feats.push(f); }
    if(!layer){
      layer=L.geoJSON(null,{
        style:gasStyle,
        onEachFeature:(f,l)=>l.on('click',e=>gasPopup(e,f.properties))});
      group.addLayer(layer);
    }
    layer.clearLayers();
    layer.addData({type:'FeatureCollection',features:feats});
  }
  gasRenders.push(render);
  gasRestyle.push(()=>{ if(layer) layer.setStyle(gasStyle); });
  group.on('add',()=>{render();updateLvHint();});
  group.on('remove',()=>{if(layer)layer.clearLayers();updateLvHint();});
  return group;
}

// ---- Cadent above-ground gas assets ------------------------------------------
// Two more OGL v3.0 datasets, small enough (~1.4k + ~270 in region) to commit
// whole and draw in one go - no tile pyramid:
//   sites  gas_ag_sites.geojson - Cadent describe these as "assets that sit above
//          ground ... usually assets that reduce the pressure of gas", i.e.
//          governors / pressure-reduction installations.
//   pipes  gas_ag_pipes.geojson - runs that cross a river, bridge or ravine.
// The open tier gives EVERY site the identical description "Above Ground Site",
// so the map deliberately does not claim a type for any individual site - the
// popup says "typically", not "this is a governor". (The "Shared" twin of the
// sites dataset has an identical schema and count, so nothing is lost here.)
// These are the gas assets you can actually see from the street, so the popups
// lead with the Street View link.
const GAS_AG_COL='#E8730C';
// Named rather than inline, because the hover highlight has to be able to put
// each of these back exactly as it found them.
const gasAgSiteStyle=f=>({radius:Math.max(3,4.6*Math.min(1.2,zMul)),
  color:'#fff',weight:1.5,fillColor:GAS_AG_COL,fillOpacity:.96});
const gasAgPipeStyle=f=>({color:GAS_AG_COL,weight:W(2.8),opacity:.95,lineCap:'round'});
// Lazily load a whole-file GeoJSON layer: nothing is fetched until switched on,
// which keeps a cold load at zero requests like every other layer.
// `transform` (optional) rewrites the FeatureCollection before it is drawn, for
// layers whose source shape is not quite what should be rendered. Everything
// else in opts goes to L.geoJSON untouched.
// Re-apply a group's style function when the zoom band changes, so the lazily
// loaded whole-file layers grade with zoom like the tiled ones do.
function gradeGroup(group, style){
  if(group&&style) gradedHooks.push(()=>{
    if(!map.hasLayer(group)) return;
    group.eachLayer(l=>{ if(l.setStyle) try{ l.setStyle(style); }catch(e){} });
  });
  return group;
}
function lazyGeoJSON(url, opts){
  const {transform, ...gjOpts}=opts||{};
  const group=L.layerGroup(); let state='idle';
  group.on('add',()=>{
    if(state!=='idle') return; state='loading';
    fetch(url).then(r=>r.ok?r.json():{features:[]})
      .then(fc=>{ group.addLayer(L.geoJSON(transform?transform(fc):fc,gjOpts)); state='loaded'; })
      // a missing file already degrades to empty above, so reaching here means a
      // network or render fault: reset so a later toggle retries, but say so
      // rather than failing silently
      .catch(e=>{ state='idle'; console.error('Failed to load '+url, e); });
  });
  return group;
}
const gasAgSitesCadent=lazyGeoJSON('gas_ag_sites.geojson',{
  pointToLayer:(f,ll)=>L.circleMarker(ll,gasAgSiteStyle(f)),
  onEachFeature:(f,l)=>{ bindHover('gas',f,l,gasAgSiteStyle);
    l.on('click',e=>{
    const ll=e.latlng||(l.getLatLng&&l.getLatLng())||map.getCenter();
    L.popup({className:'tt'}).setLatLng(ll).setContent(card({
      color:GAS_AG_COL, icon:ICON.station, kicker:'Above-ground gas site',
      meta:'Cadent &middot; typically a pressure-reduction installation',
      rows:rowsOf([['ref',f.properties.id]]), lat:ll.lat, lon:ll.lng})).openOn(map);}); }
});
// The same assets as surveyed in MAPS, where they are annotated on the OS
// background layer rather than held as gas records - "Gas Gov", "GVC", "Gas
// Valve Compound" and so on. Roughly half of these have no counterpart in
// Cadent's open above-ground dataset, which is why AGI sites looked missing.
// Drawn as a ring rather than a filled dot so the two sources stay tellable
// apart at a glance without inventing a second colour.
// Sites Cadent already publishes are dropped here rather than drawn twice: about
// half the MAPS set overlaps, and two markers on one governor was the worst of
// the duplication. Where MAPS found the compound footprint the site draws as its
// actual outline; where it only has the label, a ring.
//
// EXCEPT when MAPS surveyed the footprint. Cadent's record is only ever a point,
// so dropping the whole MAPS feature on overlap also threw away the outline and
// left a bare dot with no extent - 103 of the 198 surveyed outlines never drew.
// The duplication this guards against is two *markers*; an outline with Cadent's
// dot inside it is not that, it is the site plus its extent. So only a
// label-only MAPS point is a true duplicate worth suppressing.
const gasAgSitesMaps=lazyGeoJSON('tiles/mapsgeo/agi.geojson',{
  filter:f=>{const p=f.properties||{}; return p.bounded||!p.also_in_cadent;},
  // A surveyed footprint is usually the governor kiosk, not a compound: the
  // median outline is 10 m2, about 3 m across, which is under a pixel below
  // z17. Drawn alone it would make a bounded site LESS findable than an
  // unbounded one, so each outline also gets a dot at its recorded centre. The
  // dot is what you spot at search zoom; the outline is the extent once you are
  // in close. The dot carries the label and popup. On an overlap Cadent already
  // provides that dot, so MAPS contributes only the labelled outline.
  // The dot goes at the middle of the outline, NOT at properties.centre: that is
  // where MAPS lettered the site, which is beside the kiosk in 244 of 247 cases,
  // and a dot sitting 10 m off its own box reads as two separate things.
  transform:fc=>({type:'FeatureCollection',features:fc.features.flatMap(f=>{
    const p=f.properties||{};
    if(f.geometry.type!=='Polygon') return [f];
    // Cadent already supplies the marker for an overlapping site. Keep MAPS'
    // richer surveyed boundary and label, but do not place a second dot on it.
    if(p.also_in_cadent) return [f];
    const ring=f.geometry.coordinates[0];
    const pts=ring.length>1&&sameCoord(ring[0],ring[ring.length-1])?ring.slice(0,-1):ring;
    let x=0,y=0; for(const c of pts){x+=c[0];y+=c[1];}
    return [f,{type:'Feature',properties:{...p,centreDot:true},
               geometry:{type:'Point',coordinates:[x/pts.length,y/pts.length]}}];
  })}),
  style:f=>({color:GAS_AG_COL,weight:W(1.6),fillColor:GAS_AG_COL,fillOpacity:.18,lineJoin:'round'}),
  pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:Math.max(3.2,5*Math.min(1.2,zMul)),
    color:GAS_AG_COL,weight:2.4,fillColor:'#fff',fillOpacity:.96}),
  onEachFeature:(f,l)=>{
    const p=f.properties||{};
    // A new MAPS site is labelled on its dot. An overlapping site has Cadent's
    // dot and MAPS' boundary, so its one label belongs to that boundary.
    if(p.label&&(f.geometry.type==='Point'||p.also_in_cadent))
      l.bindTooltip(p.label,{permanent:true,direction:'top',className:'sitelbl',offset:[0,-4]});
    l.on('click',e=>{
      const ll=e.latlng||(l.getLatLng&&l.getLatLng())||map.getCenter();
      L.popup({className:'tt'}).setLatLng(ll).setContent(card({
        color:GAS_AG_COL, icon:ICON.station, kicker:'Above-ground gas site',
        meta:'National Grid MAPS &middot; '+(p.note||'as annotated on the surveyed plan'),
        rows:rowsOf([['marked',p.label],
                     ['extent',p.bounded?'surveyed outline':'label only'],
                     ['surveyed',p.surveyed?String(p.surveyed).replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3'):null]]),
        lat:ll.lat, lon:ll.lng})).openOn(map);});
  }
});
